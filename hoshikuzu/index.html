<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f171b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>星屑の勇者 — はじまりの剣と黒曜の魔王城</title>
<link rel="stylesheet" href="rpg.css?v=20261119-title-opening-03">
</head>
<body>
<main class="game-shell" id="rpg" hidden>
  <section class="world-zone" aria-label="星屑の勇者 ゲーム画面">
    <header class="game-topline">
      <span class="game-title">星屑の勇者</span>
      <span id="build-id" class="visually-hidden">町と冒険・v10</span>
      <span class="chapter" id="chapter" aria-hidden="true"></span>
      <button class="sound" id="sound-toggle" type="button" aria-label="音を消す" aria-pressed="false">♫ ON</button>
    </header>
    <div class="objective" id="objective-bar" aria-label="現在の目的">
      <span class="objective-marker" aria-hidden="true">✦</span>
      <span class="objective-caption">つぎの目的</span>
      <span id="objective-text" class="objective-text" aria-live="polite">城の魔物から人を守る</span>
    </div>
    <div class="screen-shell" id="screen-shell">
      <canvas id="game" width="480" height="270" aria-label="探索中のマップと登場人物、または戦闘中の敵と主人公"></canvas>
      <div class="location-banner" id="location-banner" hidden></div>
      <div class="dialogue" id="dialogue" tabindex="-1" data-portrait="false" aria-live="polite" aria-label="会話と戦闘メッセージ" hidden>
        <span class="speaker-tab" id="speaker-tab" aria-hidden="true" hidden></span>
        <div class="dialogue-body">
          <span class="portrait-frame" aria-hidden="true"></span>
          <p id="message"></p>
        </div>
        <span class="message-arrow" id="message-arrow" aria-hidden="true" hidden>▼</span>
      </div>
      <div id="context-hint" class="context-hint" hidden></div>
      <div id="completion" class="completion" hidden></div>
      <section class="action-panel" id="action-panel" hidden aria-label="コマンド選択">
        <header class="panel-head"><strong id="panel-title">コマンド</strong><button id="panel-close" class="close" type="button" aria-label="閉じる">×</button></header>
        <div class="panel-content" id="panel-content"></div>
      </section>
    </div>
  </section>
  <section class="controls" id="controls" aria-label="ゲームコントローラー">
      <div class="battle-status" id="battle-status" hidden aria-label="戦闘中の味方ステータス">
        <div class="battle-member">
          <strong id="battle-status-name">アレン</strong>
          <div class="battle-resource">
            <span id="battle-status-hp">HP 0</span>
            <progress id="battle-hp-bar" aria-label="HP残量" value="0"></progress>
          </div>
          <div class="battle-resource">
            <span id="battle-status-mp">MP 0</span>
            <progress id="battle-mp-bar" aria-label="MP残量" value="0"></progress>
          </div>
        </div>
        <div class="battle-member" id="battle-guest" hidden>
          <strong id="guest-status-name">ゲスト</strong>
          <div class="battle-resource">
            <span id="guest-status-hp">HP 0</span>
            <progress id="guest-hp-bar" aria-label="ゲストのHP残量" value="0"></progress>
          </div>
          <div class="battle-resource">
            <span id="guest-status-mp">MP 0</span>
            <progress id="guest-mp-bar" aria-label="ゲストのMP残量" value="0"></progress>
          </div>
        </div>
      </div>
    <div class="dpad" role="group" aria-label="移動と選択">
      <button class="up" data-dir="up" aria-label="上" type="button"><span>▲</span></button>
      <button class="left" data-dir="left" aria-label="左" type="button"><span>◀</span></button>
      <span class="dpad-center" aria-hidden="true"></span>
      <button class="right" data-dir="right" aria-label="右" type="button"><span>▶</span></button>
      <button class="down" data-dir="down" aria-label="下" type="button"><span>▼</span></button>
    </div>
    <div class="control-actions" id="control-actions">
      <div class="shortcut-grid" id="shortcut-grid" role="group" aria-label="戦闘コマンド">
        <button id="talk-shortcut" type="button">たたかう</button>
        <button id="spell-shortcut" type="button">じゅもん</button>
        <button id="item-shortcut" type="button">どうぐ</button>
        <button id="menu-button" type="button">にげる</button>
      </div>
      <div class="action-pair" role="group" aria-label="決定と戻る">
        <button id="cancel" class="face face-b" type="button"><span>B</span><small>もどる</small></button>
        <button id="confirm" class="face face-a" type="button"><span>A</span><small>決定</small></button>
      </div>
    </div>
  </section>
</main>
<div class="start-overlay" id="start-overlay">
  <section class="start-box" aria-labelledby="start-title">
    <h1 id="start-title">星屑の勇者</h1>
    <p class="start-subtitle">はじまりの剣と黒曜の魔王城</p>
    <div class="start-commands" id="start-commands" role="group" aria-label="タイトルコマンド">
      <button id="new-game" type="button" disabled>NEW GAME</button>
      <button id="continue-game" type="button" disabled>CONTINUE</button>
    </div>
    <form class="start-commands" id="start-name" hidden>
      <label for="hero-name">主人公の名前</label>
      <input id="hero-name" maxlength="12" value="アレン" autocomplete="off" enterkeyhint="done">
      <button id="begin-game" type="submit">冒険を始める</button>
      <button class="start-back" type="button">戻る</button>
    </form>
    <div class="start-commands" id="start-slots" role="group" aria-label="続きから再開する記録" hidden>
      <button id="load-auto" type="button" disabled>つづきから（自動）<small>記録なし</small></button>
      <button id="load-manual" type="button" disabled>つづきから（王様の記録）<small>記録なし</small></button>
      <button class="start-back" type="button">戻る</button>
    </div>
    <div id="start-loading" class="start-loading">
      <p id="loading-label" role="status">素材を読み込み中…</p>
      <progress id="loading-progress" aria-labelledby="loading-label"></progress>
    </div>
    <p id="start-error" class="start-error" role="alert"></p>
  </section>
  <footer class="start-links">
    <button id="start-sound" type="button" aria-pressed="false">♫ タイトル音楽</button>
    <a id="privacy-link" target="_blank" rel="noopener noreferrer">プライバシー</a>
    <a id="support-link" target="_blank" rel="noopener noreferrer">サポート</a>
  </footer>
</div>
<section class="opening" id="opening" aria-label="プロローグ" hidden>
  <div class="opening-art" aria-hidden="true">
    <img id="opening-plate" alt="">
    <img id="opening-subject" alt="" hidden>
    <div class="opening-effect"></div>
  </div>
  <button id="opening-next" class="opening-next" type="button" aria-label="次の字幕へ"></button>
  <div class="opening-caption">
    <p id="opening-text" aria-live="polite"></p>
    <span aria-hidden="true">タップで進む ▾</span>
  </div>
  <button id="opening-skip" class="opening-skip" type="button">スキップ</button>
  <p id="opening-error" class="opening-error" role="alert"></p>
</section>
<script defer src="app.js?v=20261119-title-opening-03"></script>
</body>
</html>
