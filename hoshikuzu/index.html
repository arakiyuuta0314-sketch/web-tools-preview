<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f171b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>星屑の勇者 — はじまりの剣と黒曜の魔王城</title>
<link rel="stylesheet" href="rpg.css?v=20261111-hero-motion-01">
</head>
<body>
<main class="game-shell" id="rpg">
  <section class="world-zone" aria-label="星屑の勇者 ゲーム画面">
    <header class="game-topline">
      <span class="game-title">星屑の勇者</span>
      <span id="build-id" class="visually-hidden">町と冒険・v10</span>
      <span class="chapter" id="chapter" aria-hidden="true"></span>
      <button class="sound" id="sound-toggle" type="button" aria-label="音を消す" aria-pressed="false">♫ ON</button>
    </header>
    <div class="objective" id="objective-bar" aria-label="現在の目的">
      <span class="objective-marker" aria-hidden="true">✦</span>
      <span class="objective-caption">つぎの目的</span>
      <span id="objective-text" class="objective-text" aria-live="polite">城の魔物から人を守る</span>
    </div>
    <div class="screen-shell">
      <canvas id="game" width="288" height="340" aria-label="探索中のマップと登場人物、または戦闘中の敵"></canvas>
      <div class="dialogue" id="dialogue" aria-live="polite" aria-label="会話と戦闘メッセージ" hidden>
        <p id="message"></p><span class="message-arrow" id="message-arrow" aria-hidden="true" hidden>▼</span>
      </div>
      <div id="context-hint" class="context-hint" hidden></div>
      <div id="completion" class="completion" hidden></div>
      <section class="action-panel" id="action-panel" hidden aria-label="コマンド選択">
        <header class="panel-head"><strong id="panel-title">コマンド</strong><button id="panel-close" class="close" type="button" aria-label="閉じる">×</button></header>
        <div class="panel-content" id="panel-content"></div>
      </section>
    </div>
  </section>
  <section class="controls" aria-label="ゲームコントローラー">
    <div class="controls-label" aria-hidden="true"><span>✦</span> ADVENTURE</div>
    <div class="dpad" role="group" aria-label="移動と選択">
      <button class="up" data-dir="up" aria-label="上" type="button"><span>▲</span></button>
      <button class="left" data-dir="left" aria-label="左" type="button"><span>◀</span></button>
      <span class="dpad-center" aria-hidden="true"></span>
      <button class="right" data-dir="right" aria-label="右" type="button"><span>▶</span></button>
      <button class="down" data-dir="down" aria-label="下" type="button"><span>▼</span></button>
    </div>
    <div class="control-actions">
      <div class="shortcut-grid" role="group" aria-label="ショートカット">
        <button id="talk-shortcut" type="button">はなす</button>
        <button id="item-shortcut" type="button">どうぐ</button>
        <button id="spell-shortcut" type="button">じゅもん</button>
        <button id="menu-button" type="button">メニュー</button>
      </div>
      <div class="action-pair" role="group" aria-label="決定と戻る">
        <button id="cancel" class="face face-b" type="button"><span>B</span><small>もどる</small></button>
        <button id="confirm" class="face face-a" type="button"><span>A</span><small>決定</small></button>
      </div>
    </div>
    <div class="control-tip" aria-hidden="true">十字キーで歩く · Aで話す · Bでもどる</div>
  </section>
</main>
<div class="start-overlay" id="start-overlay">
  <section class="start-box" aria-label="星屑の勇者を始める">
    <span class="start-spark" aria-hidden="true">✦</span>
    <h1>星屑の勇者</h1>
    <p class="start-subtitle">はじまりの剣と黒曜の魔王城</p>
    <div class="start-mountain" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="start-story">魔物の軍勢が王国へ迫る。<br>誰かを守ろうとした、その一歩から<br>ひとりの剣士の旅が始まる。</p>
    <label for="hero-name">なまえ</label>
    <input id="hero-name" maxlength="12" value="アレン" autocomplete="off" enterkeyhint="done" aria-label="主人公の名前">
    <button id="new-game" class="start-primary" type="button" disabled>はじめから</button>
    <button id="load-auto" class="start-secondary" type="button" disabled>つづきから（自動）</button>
    <button id="load-manual" class="start-secondary" type="button" disabled>つづきから（王様の記録）</button>
    <button id="start-sound" class="start-sound" type="button" aria-pressed="false">♫ タイトル音楽を聴く</button>
    <p id="start-error" class="start-error" role="alert"></p>
    <div class="legal"><a id="privacy-link" target="_blank" rel="noopener noreferrer">プライバシー</a><span>·</span><a id="support-link" target="_blank" rel="noopener noreferrer">サポート</a></div>
  </section>
</div>
<script defer src="app.js?v=20261111-hero-motion-01"></script>
</body>
</html>
