}

<script src="viewer.js?v=fixed1"></script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('world'),ctx=canvas.getContext('2d'),overlay=$('overlay');
const src={
 entrance:{w:546,h:483,spawn:[326,425],name:'エントランス'},
 gallery:{w:589,h:482,spawn:[295,418],name:'展示室'}
};
const works=[]; // Empty collection; source photos stay local during Web tests.
const MAX_WORKS=30;
// One canonical seven-passage graph, shared by movement, rendering and map.
const L=window.A18Layout;
const ROOM_LINKS=L.ROOM_LINKS;
const P2=window.A18P2Store;
const ROOM_LABELS=window.A18Navigation.NAMES;
let galleryIndex=0; // roomId 0 = entrance, 1 = gallery 02.
const fixtures=L.defaults();
L.restoreClassicFrameDimensions(fixtures);
L.enforceFixedLayout(fixtures);
const roomRects=()=>L.roomFrames(fixtures,galleryIndex).map(L.r);
const frameCount=room=>L.roomFrames(fixtures,room).length;
const roomStart=room=>room===0?0:5+(room-1)*5;
const roomCapacity=room=>frameCount(room);
const roomCount=()=>6;
const unlockedRooms=()=>currentSave?.progression.unlockedThroughLevel??1;
const slotId=i=>L.legacyId(i);
const fixtureRank=id=>{
 const f=fixtures.find(f=>f.id===id);
 return f?.legacySlot??999;
};
const fixtureAt=i=>fixtures.find(f=>f.id===slotId(i));
function artworkLocation(w){
 if(w.fixtureId==null)return '保管中';
 const f=fixtures.find(f=>f.id===w.fixtureId);
 if(!f)throw Error('作品が存在しない設備を参照: '+w.id);
 return ROOM_LABELS[f.roomId]+'・枠'+(f.legacySlot-roomStart(f.roomId)+1);
}
let museumTitle='とっておき美術館',playerName='',viewMode='overview';
let scene='entrance',pos={x:326,y:425,dir:'up',stride:0},carrying=null,carryOrigin=null,modal=false,cameraX=0,cameraY=0,logicalW=546,logicalH=483,frame=0,loaded=false,tutorialStep=0;
const MOVE_DISTANCE=12,MOVE_REPEAT_MS=65,MOVE_SUBSTEP=3;
let activeInteraction=null,avatarGender='male',assetManifest=null,saveTimer=null;
let currentSave=null, saving=false, saveBlocked=false, showingEvent=false;
function applyCommitted(save){
 const old=works.map(w=>w.originalURL).filter(u=>u?.startsWith('blob:'));
 currentSave=save;
 fixtures.splice(0,fixtures.length,...P2.copy(save.fixtures));
 works.splice(0,works.length,...P2.hydrate(save.works));
 avatarGender=save.avatarGender;playerName=save.playerName;museumTitle=save.museumTitle;
 galleryIndex=save.galleryIndex;scene=galleryIndex===0?'entrance':'gallery';
 pos={...save.pos};carrying=save.carrying;carryOrigin=null;
 $('museumName').textContent=museumTitle;
 trimImageCache();if(loaded){resize();update();}
 for(const url of old)URL.revokeObjectURL(url);
}
function saveError(e){
 saveBlocked=true;
 console.error('A18 P2 commit halted:',e);
 $('hint').textContent='保存できませんでした（'+(e.code||e.name||'ERROR')+'）。これ以上編集せず再読み込みしてください。';
 $('hint').hidden=false;
}
async function commitChange(change,{event=true}={}){
 if(saving||saveBlocked||!currentSave)return false;
 saving=true;
 try{
  const candidate=P2.copy(currentSave);
  // Live walking coordinates are pending until a committed operation captures them.
  candidate.pos={...pos};candidate.galleryIndex=galleryIndex;
  change(candidate);
  L.syncWorks(candidate.fixtures,candidate.works);
  const result=P2.plan(currentSave,candidate);
  await P2.commit(result.expectedRevision,result.nextSave);
  applyCommitted(result.nextSave);
  if(event&&result.transition?.eventId)showProgressionEvent(result.transition.eventId);
  return true;
 }catch(e){saveError(e);return false}
 finally{saving=false}
}
function requestSave(){
 clearTimeout(saveTimer);
 if(!currentSave||saving||saveBlocked)return;
 saveTimer=setTimeout(()=>{
  if(saving||saveBlocked)return;
  if(currentSave.galleryIndex!==galleryIndex||JSON.stringify(currentSave.pos)!==JSON.stringify(pos))
   void commitChange(()=>{},{event:false});
 },450);
}
async function commitEventAction(action,id=null){
 if(saving||saveBlocked)return false;
 saving=true;
 try{
  const eventId=id||currentSave.progression.events.find(e=>e.status==='queued')?.id;
  if(!eventId)throw Error('E_EVENT_UNKNOWN');
  const next=P2.eventAction(currentSave,eventId,action);
  await P2.commit(currentSave.revision,next);
  applyCommitted(next);return true;
 }catch(e){saveError(e);return false}
 finally{saving=false}
}
let p6Dialogues=null, storyBusy=false;
function eventData(id){
 const data=p6Dialogues?.events.find(e=>e.eventId===id);
 if(!data)throw Error('E_P6_EVENT_UNKNOWN '+id);
 return data;
}
function storyActor(data){
 return data.actors[0]==='butler'?'butler':'staff';
}
function storyLine(line){
 const butlerName=window.A18Registration.honorific('butler',playerName,avatarGender);
 const staffName=window.A18Registration.honorific('staff',playerName,avatarGender);
 return String(line).replaceAll('{playerHonorific}',butlerName)
  .replaceAll('{playerStaffName}',staffName).replaceAll('{museumTitle}',museumTitle);
}
function storyPortrait(role,message){
 const person=role==='butler'?'爺や':'展示室スタッフ';
 const meta=window.A18Art.manifest?.[role];
 if(!meta?.portraitPath)throw Error('E_P6_PORTRAIT_MISSING '+role);
 return '<div class="rpg-chat p6-story-chat"><div class="rpg-portrait"><img src="'+esc(meta.portraitPath)+'" alt="'+esc(person)+'"></div>'+
 '<div class="rpg-words"><span class="rpg-name">'+esc(person)+'</span><p class="rpg-message">'+esc(storyLine(message))+'</p></div></div>';
}
function storyFailure(){
 const error=$('p6EventError');
 if(error)error.textContent='保存できませんでした。会話の既読状態は更新していません。再読み込みして再開してください。';
 const retry=$('p6Reload');
 if(retry)retry.hidden=false;
}
function storySuccess(){
 showingEvent=false;
 close();
 if(!saveBlocked)showProgressionEvent();
}
async function storyCommit(id,action,fromHistory=false){
 if(storyBusy||saving||saveBlocked)return;
 storyBusy=true;
 try{
  if(await commitEventAction(action,id)){
   if(fromHistory){showingEvent=false;close();showStoryHistory();}
   else storySuccess();
  }else storyFailure();
 }finally{storyBusy=false;}
}
function queuedProgressionEvent(){
 return currentSave?.progression.events.find(e=>e.status==='queued'&&e.id!=='intro-v1')||null;
}
function storySession(event,fromHistory=false){
 const data=eventData(event.id),role=storyActor(data);
 if(!Array.isArray(data.lines)||data.lines.length<1)throw Error('E_P6_LINES');
 return {id:event.id,data,role,index:0,fromHistory};
}
function renderStoryPage(session){
 const {id,data,role,index,fromHistory}=session;
 const isFinal=id==='gallery06-complete-v1';
 const header=isFinal?'展示室06 完成記念':data.systemText;
 const mode=fromHistory?'会話の記録':'美術館のできごと';
 const body='<div class="p6-story-meta">'+esc(mode)+'　'+(index+1)+' / '+data.lines.length+'</div>'+
  '<h3 class="p6-story-title">'+esc(header)+'</h3>'+storyPortrait(role,data.lines[index])+
  '<p id="p6EventError" class="error" role="alert"></p>'+
  '<div class="p6-story-actions">'+
  (index<data.lines.length-1?'<button id="p6Next" type="button">次の会話へ ▼</button>':'')+
  '<button id="p2EventFinish" type="button">'+(fromHistory?'読み終える':'会話を終える')+'</button>'+
  '<button id="p2EventSkip" type="button" class="light">'+(fromHistory?'一覧に戻る':'あとで読む')+'</button>'+
  '<button id="p6Reload" type="button" class="light" hidden>再読み込みして復帰</button></div>';
 open(fromHistory?'美術館の物語':header,body,'rpg');
 if($('p6Next'))$('p6Next').onclick=()=>{
  if(storyBusy||session.index>=session.data.lines.length-1)return;
  session.index++;renderStoryPage(session);
 };
 $('p2EventFinish').onclick=()=>{
  const event=currentSave.progression.events.find(e=>e.id===id);
  if(fromHistory&&event.status==='seen'){showingEvent=false;showStoryHistory();return;}
  void storyCommit(id,'finish',fromHistory);
 };
 $('p2EventSkip').onclick=()=>{
  const event=currentSave.progression.events.find(e=>e.id===id);
  if(fromHistory){showingEvent=false;showStoryHistory();return;}
  if(event.status==='queued')void storyCommit(id,'skip');
 };
 $('p6Reload').onclick=()=>location.reload();
}
function showProgressionEvent(id=null,options={}){
 if(showingEvent||modal||saveBlocked||!p6Dialogues)return;
 const ev=id?currentSave?.progression.events.find(e=>e.id===id):queuedProgressionEvent();
 if(!ev)return;
 const fromHistory=options.replay===true;
 if(!fromHistory&&ev.status!=='queued')return;
 const data=eventData(ev.id);
 // Automatic scene dialogue is allowed only in the actor's real source room.
 if(!fromHistory&&galleryIndex!==data.sourceRoomId)return;
 if(ev.id==='intro-v1'){
  if(fromHistory){
   showingEvent=true;
   const lines=data.steps.filter(step=>step.type==='dialogue').map(step=>step.text);
   renderStoryPage({id:ev.id,data:{...data,lines,systemText:'はじまりの物語'},role:'butler',index:0,fromHistory:true});
  }else if(!playerName)showIntroOpening();
  else showIntroAfterProfile();
  return;
 }
 showingEvent=true;
 renderStoryPage(storySession(ev,fromHistory));
}
function showIntroOpening(){
 if(showingEvent||modal||saveBlocked)return;
 const intro=eventData('intro-v1');
 if(!currentSave.progression.events.some(e=>e.id==='intro-v1'&&e.status==='queued'))return;
 showingEvent=true;
 let index=0;
 function render(){
  const steps=intro.steps.filter(step=>['O01','O02','O03'].includes(step.step));
  open('とっておき美術館へ、ようこそ',
   '<div class="p6-story-meta">はじまりの物語　'+(index+1)+' / '+steps.length+'</div>'+
   storyPortrait('butler',steps[index].text)+
   '<div class="p6-story-actions"><button id="introNext">'+(index===2?'館長になる':'次へ ▼')+'</button>'+

function open(title,contents,kind='standard'){
 modal=true;overlay.classList.toggle('rpg-mode',kind==='rpg');overlay.classList.toggle('art-inspect-mode',kind==='art-inspect');
 $('dialog').classList.remove('registration-compact');

function editMemo(a){
 open('備考・思い出を編集',
  '<p class="small">作品「'+esc(a.title)+'」に残しておきたい出来事や思い出を書けます。</p>'+
  '<label>備考・思い出<textarea id="editMemo" maxlength="3000" rows="6"></textarea></label>'+
  '<div class="row"><button id="saveMemo">保存する</button><button id="cancelMemo" class="light">戻る</button></div>');
 $('editMemo').value=a.notes||'';
 $('saveMemo').onclick=async()=>{
  const id=a.id,notes=$('editMemo').value.trim();
  if(await commitChange(s=>{const w=s.works.find(w=>w.id===id);if(!w)throw Error('E_WORK_MISSING');w.notes=notes;})){
   const w=works.find(w=>w.id===id);
   if(w.fixtureId!=null)inspect(fixtureRank(w.fixtureId));else list();
  }
 };
 $('cancelMemo').onclick=()=>{if(a.fixtureId!=null)inspect(fixtureRank(a.fixtureId));else list();};
}
function resetDisplayForWork(slotIndex,work){
 const f=fixtureAt(slotIndex);
 if(!f||!work)throw Error('展示設備または作品がありません');
 f.imageMode=work.preferredShape==='portrait'?'contain':'cover';
 f.imageScale=1;f.imageX=0;f.imageY=0;
}
function inspect(i){
 if(saving||saveBlocked)return;
 if(carrying){
  const heldId=carrying,held=works.find(w=>w.id===heldId);
  if(!held)throw Error('E_CARRY_CONFLICT');
  const targetId=slot(i)?.id||null, dest=slotId(i);
  void commitChange(s=>{
   const w=s.works.find(w=>w.id===heldId);
   w.fixtureId=dest;
   const f=s.fixtures.find(f=>f.id===dest);
   f.imageMode=w.preferredShape==='portrait'?'contain':'cover';
   f.imageScale=1;f.imageX=0;f.imageY=0;
   if(targetId&&targetId!==heldId){
    s.works.find(w=>w.id===targetId).fixtureId=null;
    s.carrying=targetId;
   }else{s.carrying=null;}
  }).then(ok=>{
   if(ok&&targetId&&targetId!==heldId){
    $('hint').hidden=false;$('hint').textContent='作品を受け取りました。次の額縁へ運べます';
   }
  });
  return;
 }
 const a=slot(i);
 if(!a){open('空の額縁','<p>スタッフから新しい作品を受け取り、この額縁まで運んできましょう。</p><div class="row"><button id="close">わかった</button></div>');$('close').onclick=close;return}
 const img=a.displaySrc||a.originalURL||'';
 const items=[...works].filter(w=>w.fixtureId!=null).sort((x,y)=>fixtureRank(x.fixtureId)-fixtureRank(y.fixtureId)).map(w=>({id:w.id,title:w.title,pieces:w.pieces,complete:w.complete,registered:w.registered,notes:w.notes||'',src:w.displaySrc||w.originalURL||'',originalSrc:w.originalURL||''}));
 open(a.title,'<div class="inspect-shell"><div class="inspect-top"><h2>'+esc(a.title)+'</h2><p>完成日：'+esc(a.complete||'不明')+'　登録日：'+esc(a.registered||'不明')+'　ピース：'+esc(a.pieces||'未登録')+'</p></div>'+
 '<button id="inspectPhoto" class="inspect-photo" type="button" aria-label="写真をフルサイズで鑑賞する">'+(img?'<img src="'+esc(img)+'" alt="'+esc(a.title)+'">':'<span>写真を読み込めませんでした</span>')+'<span class="inspect-tap">タップで大きく鑑賞</span></button>'+
 '<div class="inspect-memory"><strong>備考・思い出</strong><p>'+esc(a.notes||'まだ記録されていません')+'</p></div>'+
 '<div class="inspect-bottom"><button id="lift">持ち上げる</button><button id="editNote">備考を編集</button><button id="close">閉じる</button></div></div>','art-inspect');
 $('editNote').onclick=()=>editMemo(a);
 $('lift').onclick=async()=>{if(await commitChange(s=>{s.works.find(w=>w.id===a.id).fixtureId=null;s.carrying=a.id;}))close();};
 let inspectSwipeStart=null,inspectSwiped=false;
 const inspectPhoto=$('inspectPhoto');
 inspectPhoto.style.touchAction='none';
 inspectPhoto.addEventListener('pointerdown',e=>{inspectSwipeStart={x:e.clientX,y:e.clientY};inspectSwiped=false;});
 inspectPhoto.addEventListener('pointerup',e=>{if(!inspectSwipeStart)return;const dx=e.clientX-inspectSwipeStart.x,dy=e.clientY-inspectSwipeStart.y;inspectSwipeStart=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){inspectSwiped=true;const next=items.findIndex(w=>w.id===a.id)+(dx<0?1:-1);if(next>=0&&next<items.length){const target=works.find(w=>w.id===items[next].id);if(target?.fixtureId!=null){close();inspect(fixtureRank(target.fixtureId));}}}});
 $('inspectPhoto').onclick=()=>{if(inspectSwiped){inspectSwiped=false;return;}close();window.A18Viewer.open({items,selectedId:a.id,onClose:(selectedId)=>{modal=false;const selected=works.find(w=>w.id===selectedId);if(selected?.fixtureId!=null)inspect(fixtureRank(selected.fixtureId));}});modal=true;};
 $('close').onclick=close;
}
function confirmDeleteWork(id){
 const work=works.find(w=>w.id===id);
 if(!work)throw Error('削除する作品がありません：'+id);
 const loc=work.fixtureId!=null?artworkLocation(work):'保管中';
 open('作品の破棄',
  '<p><strong>「'+esc(work.title)+'」</strong>を完全に削除しますか？</p>'+
  '<p class="small">'+esc(loc)+'。登録した写真の原本・展示用写真・備考も、この端末の美術館データから削除されます。元の写真アプリの画像は削除されません。</p>'+
  '<p class="a18-delete-warning">この操作は取り消せません。</p>'+
  '<p id="deleteError" class="error" role="alert"></p>'+
  '<div class="row"><button id="confirmDelete" class="a18-danger">作品を完全に削除する</button><button id="cancelDelete" class="light">削除しない</button></div>');
 $('cancelDelete').onclick=list;
 $('confirmDelete').onclick=async()=>{
  const btn=$('confirmDelete');btn.disabled=true;btn.textContent='削除しています…';
  try{
   const ok=await commitChange(s=>{
    const before=s.works.length;
    s.works=s.works.filter(w=>w.id!==id);
    if(s.works.length!==before-1)throw Error('E_DELETE_TARGET');
    if(s.carrying===id)s.carrying=null;
   });
   if(!ok)return;
   workImageCache.delete(id);
   update();list();
  }catch(error){
   console.error('A18 work deletion failed',error);
   $('deleteError').textContent='削除できませんでした。データは保持されています：'+error.message;
   btn.disabled=false;btn.textContent='もう一度試す';
  }
 };
}
function list(){
 const displayed=[...works].sort((a,b)=>fixtureRank(a.fixtureId)-fixtureRank(b.fixtureId));
 const cards=displayed.map(a=>{
  const img=a.thumbnail||a.displaySrc||a.originalURL||'';
  return '<div class="artitem">'+(img?'<img class="art-thumb" src="'+esc(img)+'" alt="">':'<span class="art-thumb blank-thumb" aria-hidden="true">額</span>')+
   '<span class="artitem-copy"><b>'+esc(a.title)+'</b><small>'+artworkLocation(a)+' ／ 完成日：'+esc(a.complete||'不明')+'</small>'+
 (a.notes?'<small class="art-memory">思い出：'+esc(a.notes.length>58?a.notes.slice(0,58)+'…':a.notes)+'</small>':'')+'</span>'+
   '<button data-work="'+esc(a.id)+'">'+(a.fixtureId!=null?'作品を見る':'取り出す')+'</button>'+
   '<button class="a18-work-delete" data-delete-work="'+esc(a.id)+'" aria-label="'+esc(a.title)+'を削除">削除</button></div>';
 });
 open('作品一覧', '<p class="small">'+works.length+' / '+MAX_WORKS+'作品　写真から探して選べます。</p>'+
 (cards.length?'<div class="artlist">'+cards.join('')+'</div>':'<p class="empty-collection">登録された作品はまだありません。<br>エントランスのスタッフに写真を預けてみましょう。</p>')+
 '<div class="row"><button id="close" class="light">閉じる</button></div>');
 document.querySelectorAll('[data-delete-work]').forEach(button=>{
  button.onclick=()=>confirmDeleteWork(button.dataset.deleteWork);
 });
 document.querySelectorAll('[data-work]').forEach(button=>button.onclick=()=>{
  const art=works.find(a=>a.id===button.dataset.work);if(!art)return;
  if(art.fixtureId!=null){
   const items=[...works].filter(x=>x.fixtureId!=null).sort((a,b)=>fixtureRank(a.fixtureId)-fixtureRank(b.fixtureId)).map(w=>({
     id:w.id,title:w.title,pieces:w.pieces,complete:w.complete,registered:w.registered,notes:w.notes||'',
     src:w.displaySrc||w.originalURL||'',originalSrc:w.originalURL||''
   }));
   close();window.A18Viewer.open({items,selectedId:art.id,onClose:()=>{modal=false;list()}});modal=true;
  }else{
   if(carrying){open('作品の持ち運び','<p>いま持っている作品をしまってから選んでください。</p><div class="row"><button id="close">閉じる</button></div>');$('close').onclick=close;return;}
   void commitChange(s=>{s.carrying=art.id;}).then(ok=>{if(ok)close();});
  }
 });
 $('close').onclick=close;
}
function staffDialog(role='staff'){
 window.A18Registration.staffDialog({open,close,list,form,carrying,role,playerName,gender:avatarGender,works});
}
function fade(){const fade=document.createElement('div');fade.style.cssText='position:fixed;z-index:19;inset:0;background:#102d27;opacity:1;transition:opacity .4s;pointer-events:none';document.body.appendChild(fade);requestAnimationFrame(()=>fade.style.opacity='0');setTimeout(()=>fade.remove(),440);}
function form(spotNo=0,viaStaff=false,role=galleryIndex===0?'butler':'staff'){
 window.A18Registration.form({spotNo,viaStaff,open,close,slot,changeScene,works,maxWorks:MAX_WORKS,role,playerName,gender:avatarGender,
  onRegistered:async(work)=>commitChange(s=>{
   if(s.works.length>=MAX_WORKS)throw Error('E_WORK_LIMIT');
   if(s.works.some(w=>w.id===work.id))throw Error('E_WORK_DUPLICATE');
   s.works.push(P2.persisted({...s,works:[work]}).works[0]);
   s.carrying=work.id;
  })});
}
const heldKeys=new Set();let pointerLoop=null;
$('museumName').onclick=showSettings;
$('settingsGear').onclick=showSettings;
$('floorMapButton').onclick=()=>showFloorMap();
function showFloorMap(){
 if(modal||showingEvent||saveBlocked)return;
 open('館内図',window.A18Navigation.mapHTML(galleryIndex,currentSave.progression)+
  '<div class="row"><button id="closeFloorMap">歩いて戻る</button></div>');
 $('closeFloorMap').onclick=close;
}
$('act').onclick=action;
$('cancel').onclick=()=>{void commitChange(s=>{s.carrying=null;});};
overlay.onclick=e=>{if(e.target===overlay&&!showingEvent)close()};
canvas.onclick=e=>{if(modal)return;const h=nearby();if(h?.type==='art'){const pt=worldPoint(e),[x1,y1,x2,y2]=roomRects()[h.i-roomStart(galleryIndex)];if(pt.x>x1-28&&pt.x<x2+28&&pt.y>y1-31&&pt.y<y2+55)inspect(h.i);}};
window.addEventListener('keydown',e=>{if(modal)return;if(movement[e.key]){e.preventDefault();heldKeys.add(e.key);if(!e.repeat)walk(movement[e.key])}else if(e.key==='Enter'){e.preventDefault();action()}});
window.addEventListener('keyup',e=>heldKeys.delete(e.key));
window.addEventListener('blur',()=>heldKeys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden){heldKeys.clear();clearInterval(pointerLoop)}});
setInterval(()=>{if(!modal&&heldKeys.size){const key=[...heldKeys].at(-1);walk(movement[key]);}},MOVE_REPEAT_MS);
for(const b of document.querySelectorAll('[data-d]')){const stop=()=>{clearInterval(pointerLoop);pointerLoop=null};b.onpointerdown=e=>{e.preventDefault();stop();walk(b.dataset.d);pointerLoop=setInterval(()=>walk(b.dataset.d),MOVE_REPEAT_MS);if(b.setPointerCapture)b.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,stop);}
for(const ev of ['contextmenu','selectstart','dragstart'])$('dpad').addEventListener(ev,e=>e.preventDefault());$('dpad').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);
window.__A18_SCENE_STUDY__={
 state:()=>({scene,galleryIndex,roomNumber:galleryIndex+1,roomName:ROOM_LABELS[galleryIndex],links:{...ROOM_LINKS[galleryIndex]},allRoomLinks:JSON.parse(JSON.stringify(ROOM_LINKS)),unlockedRooms:unlockedRooms(),maxWorks:MAX_WORKS,roomCapacity:roomCapacity(galleryIndex),frameRects:roomRects().map(r=>[...r]),interactionAnchors:interactionCandidates().map(h=>({...h})),obstacles:roomObstacles().map(r=>[...r]),wallFootLine:wallFootLine(),pos:{...pos},carrying,carryOrigin,museumTitle,playerName,viewMode,avatarGender,museumLevel:unlockedRooms(),assetStatus:window.A18Art.stats(),fixtures:L.clone(fixtures),viewport:{logicalW,logicalH,cameraX,cameraY,backingWidth:canvas.width,backingHeight:canvas.height,portrait:isPortraitGame()},interaction:nearby(),movement:{step:MOVE_DISTANCE,repeatMs:MOVE_REPEAT_MS},works:works.map(a=>({id:a.id,fixtureId:a.fixtureId,title:a.title,complete:a.complete,notes:a.notes||''}))}),
 move:walk,canMove:safeMove,changeScene,inspect,form,list,showFloorMap,showSettings,showStoryHistory,showProgressionEvent,staffDialog,butlerDialog,checkPortal,portalEdges:PORTAL_EDGES,
 setAvatar:g=>{if(!['male','female'].includes(g))throw Error('不明な館長');return commitChange(s=>{s.avatarGender=g;});},
 validateLayout:room=>L.validatePlacement(fixtures,room),
  ready:()=>loaded,
  p2: P2.testMode?{
   addSyntheticWork: async (id,blob,notes='合成テストの備考',preferredShape='landscape')=>commitChange(s=>{
    if(!(blob instanceof Blob))throw Error('E_BLOB_MISSING');
    if(!['landscape','portrait','square'].includes(preferredShape))throw Error('E_SHAPE_INVALID');
    if(s.carrying)throw Error('E_CARRY_CONFLICT');
    s.works.push({id,title:id,complete:'2026-10-23',registered:'2026-10-23',pieces:42,
     preferredShape,notes,fixtureId:null,thumbnail:null,originalBlob:blob,displaySrc:null});
    s.carrying=id;
   }),
   injectFault:kind=>P2.setFault(kind),
   persistent:()=>P2.copy(currentSave),
   blocked:()=>saveBlocked,
   eventFinish:action=>commitEventAction(action)
  }:null
};
boot().catch(e=>{$('hint').textContent=e.message;console.error(e)});
})();
