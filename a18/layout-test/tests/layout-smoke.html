<!doctype html><html lang="ja"><meta charset="utf-8"><title>A18 layout smoke</title>
<style>body{font:14px system-ui;margin:5px}iframe{width:900px;height:650px;border:1px solid #999}pre{white-space:pre-wrap}</style>
<iframe id="game" src="../index.html"></iframe><pre id="result">RUNNING</pre>
<script>
(async()=>{
 const out=[],assert=(condition,message)=>{if(!condition)throw Error(message);out.push('PASS '+message);document.getElementById('result').textContent=out.join('\\n')};
 const sleep=n=>new Promise(r=>setTimeout(r,n));
 const frame=document.getElementById('game'),api=()=>frame.contentWindow.__A18_SCENE_STUDY__;
 const until=async(fn,label='condition',ms=12000)=>{
  const start=Date.now();while(Date.now()-start<ms){try{if(fn())return true}catch(e){}await sleep(70)}
  throw Error('Timeout '+label);
 };
 let errors=[];frame.addEventListener('load',()=>frame.contentWindow.addEventListener('error',e=>errors.push(e.message)));
 try{
  await until(()=>api()?.ready(),'initial boot');
  let game=frame.contentWindow,doc=game.document,L=game.A18Layout;
  if(doc.getElementById('confirmName')){
   doc.getElementById('a18PlayerName').value='ゆた';
   doc.getElementById('a18PlayerGender').value='female';
   doc.getElementById('a18MuseumTitle').value='ゆた美術館';
   doc.getElementById('confirmName').click();
   if(doc.getElementById('skipTour'))doc.getElementById('skipTour').click();
  }
  assert(api().state().playerName==='ゆた'&&api().state().avatarGender==='female','initial setup saves name gender');
  assert(api().state().museumTitle==='ゆた美術館','initial setup saves museum name');
  assert(api().state().museumLevel===1,'new museum starts at fixed level 1');
  assert(Boolean(doc.getElementById('settingsGear')),'settings gear accessible in lower-right');
  doc.getElementById('settingsGear').click();
  assert(Boolean(doc.getElementById('adRemoval'))&&doc.getElementById('adRemoval').disabled,'nonfunctional purchase disabled');
  assert(doc.getElementById('a18PlayerName').value==='ゆた','settings retains name');
  doc.getElementById('a18PlayerName').value='ゆう';
  doc.getElementById('saveProfile').click();
  assert(api().state().playerName==='ゆう','settings changes curator name');
  assert(api().state().interactionAnchors.every(h=>h.type!=='staff'),'entrance has butler but no staff');

  assert(api().state().fixtures.filter(f=>f.kind==='frame').length===28,'28 frames default');
  assert(api().state().fixtures.filter(f=>f.kind==='decor').length===0,'new museum uses only curated fixtures');
  assert(game.A18Navigation.validateGraph(api().state().allRoomLinks),'floor map matches all passages');
  assert(game.document.getElementById('floorMapButton'),'accessible floor map button');
  doc.getElementById('floorMapButton').click();
  assert(doc.querySelectorAll('.a18-room-tile').length===6,'all six rooms drawn in floor map');
  doc.getElementById('closeFloorMap').click();
  assert(api().state().assetStatus.loaded===48,'approved 48 character sprites decoded');
  assert(api().state().assetStatus.paths.every(x=>x.includes('/official/characters/')),'unapproved furniture PNG is not loaded');
  let totalLinks=0;
  for(let room=0;room<6;room++){
   const f=api().state().fixtures;
   assert(L.validatePlacement(f,room).ok,'room '+room+' valid');
   api().changeScene(room);
   totalLinks+=Object.keys(api().state().links).length;
  }
  assert(totalLinks===14,'7 bidirectional doors');
  const originalFrame=api().state().fixtures.find(f=>f.id==='frame-0-0');
  assert(originalFrame.width===100 && originalFrame.height===77,'frame dimensions restored to v1.8');
  const doorEdges=game.A18Navigation.EDGES;
  function travelToDoor(room,edge){
   api().changeScene(room);
   const before=api().state(),dest=before.links[edge],bounds=doorEdges[before.scene][edge];
   const steps=[['up',0,-12],['down',0,12],['left',-12,0],['right',12,0]];
   const queue=[{x:before.pos.x,y:before.pos.y,route:[]}],seen=new Set([before.pos.x+','+before.pos.y]);
   let found=null;
   for(let i=0;i<queue.length && i<5000;i++){
    const point=queue[i];
    if(point.x>=bounds.x1&&point.x<=bounds.x2&&point.y>=bounds.y1&&point.y<=bounds.y2){found=point;break;}
    for(const [dir,dx,dy]of steps){
     const nx=point.x+dx,ny=point.y+dy,key=nx+','+ny;
     if(seen.has(key))continue;
     // The player moves in four swept 3px increments.
     let legal=true;
     for(let sub=1;sub<=4;sub++)if(!api().canMove(point.x+dx*sub/4,point.y+dy*sub/4)){legal=false;break;}
     if(!legal)continue;
     seen.add(key);queue.push({x:nx,y:ny,route:[...point.route,dir]});
    }
   }
   assert(Boolean(found),'reachable door from room '+room+' toward '+edge);
   for(const dir of found.route)api().move(dir);
   assert(api().state().galleryIndex===dest,'walking through '+room+'/'+edge+' reaches '+dest);
  }
  for(let room=0;room<6;room++)
   for(const edge of Object.keys(api().state().allRoomLinks[room]))travelToDoor(room,edge);
  api().changeScene(0);

  api().changeScene(0);
  const butler=api().state().interactionAnchors.find(h=>h.type==='butler');
  assert(Boolean(butler),'entrance butler has interaction anchor');
  const origin=api().state().pos;
  const quest=[{x:origin.x,y:origin.y,steps:[]}],known=new Set([origin.x+','+origin.y]);
  let nearButler=null;
  for(let i=0;i<quest.length&&i<4500;i++){
   const point=quest[i];
   if(Math.hypot(point.x-butler.x,point.y-butler.y)<butler.enter-1){nearButler=point;break;}
   for(const [dir,dx,dy] of [['left',-12,0],['up',0,-12],['right',12,0],['down',0,12]]){
    const nx=point.x+dx,ny=point.y+dy,key=nx+','+ny;
    if(known.has(key))continue;
    if([1,2,3,4].some(i=>!api().canMove(point.x+dx*i/4,point.y+dy*i/4)))continue;
    known.add(key);quest.push({x:nx,y:ny,steps:[...point.steps,dir]});
   }
  }
  assert(Boolean(nearButler),'butler is approachable through real open floor');
  for(const dir of nearButler.steps)api().move(dir);
  assert(api().state().interaction?.type==='butler','butler reachable by walking');
  doc.getElementById('act').click();doc.getElementById('rpgAdvance').click();
  assert(!doc.getElementById('a18Decorate'),'rearrangement is not offered to players');
  assert(!doc.getElementById('sort'),'sorting command has been retired');
  assert(doc.getElementById('staffRegister')&&doc.getElementById('staffChat')&&doc.getElementById('all'),'butler has register/list/chat');
  doc.getElementById('staffRegister').click();
  assert(Boolean(doc.getElementById('photo'))&&doc.querySelector('.rpg-portrait img')?.src.includes('butler-front-00.png'),'butler can accept photo registration in entrance');
  doc.getElementById('close').click();
  api().butlerDialog();doc.getElementById('rpgAdvance').click();
  assert(doc.getElementById('dialog').textContent.includes('お嬢様'),'butler addresses female curator as ojou-sama');
  assert(doc.querySelector('.rpg-portrait img')?.src.includes('butler-front-00.png'),'real butler portrait in dialogue');
  doc.getElementById('staffChat').click();
  assert(doc.getElementById('dialog').textContent.includes('ゆうお嬢様'),'butler chat uses configured name');
  doc.getElementById('close').click();
  api().changeScene(1);
  assert(api().state().interactionAnchors.some(h=>h.type==='staff')&&!api().state().interactionAnchors.some(h=>h.type==='butler'),'gallery has staff but no butler');
  api().staffDialog('staff');doc.getElementById('rpgAdvance').click();
  assert(doc.getElementById('dialog').textContent.includes('ゆうさん'),'staff says player name with san');
  assert(doc.getElementById('staffChat')&&doc.getElementById('staffRegister')&&doc.getElementById('all'),'staff and butler have same commands');
  doc.getElementById('close').click();
  api().changeScene(0);
  assert(!game.A18LayoutEditor&&!('openEditor' in api()),'free layout editor is not available in gameplay');
  frame.style.width='390px';frame.style.height='780px';await sleep(250);
  assert(game.matchMedia('(orientation:portrait) and (max-width:850px)').matches,'iPhone 12 width portrait recognized');
  assert(game.getComputedStyle(doc.getElementById('settingsGear')).position==='absolute','settings button outside art canvas');
  api().changeScene(0);for(const dir of nearButler.steps)api().move(dir);
  assert(doc.getElementById('act').getBoundingClientRect().top>=doc.getElementById('world').getBoundingClientRect().bottom-2,'interaction button lives under map alongside movement controls');
  assert(game.A18Art.stats().loaded===48,'only 48 approved sprites loaded');
  frame.style.width='900px';frame.style.height='650px';await sleep(200);
  api().setAvatar('female');assert(api().state().avatarGender==='female','female avatar choice');
  assert(game.A18Art.get(game.A18Art.manifest.butler.path)?.naturalWidth===60,'real butler stand loaded');
  function makeImage(){
   return new Promise(resolve=>{
    const c=doc.createElement('canvas');c.width=30;c.height=90;
    const cx=c.getContext('2d');cx.fillStyle='#392d70';cx.fillRect(0,0,30,90);
    cx.fillStyle='#efbc61';cx.fillRect(5,15,20,60);
    c.toBlob(blob=>resolve(new game.File([blob],'vertical.png',{type:'image/png'})),'image/png');
   });
  }
  async function register(title){
   api().form(0,true);
   doc.getElementById('name').value=title;
   doc.getElementById('notes').value='思い出の試験記録';
   const dt=new game.DataTransfer();dt.items.add(await makeImage());
   doc.getElementById('photo').files=dt.files;
   doc.getElementById('save').click();
   await until(()=>doc.getElementById('offerNo'),'photo offer');
   doc.getElementById('offerNo').click();
   await until(()=>doc.getElementById('receiveWork'),'received work');
   doc.getElementById('receiveWork').click();
   assert(Boolean(api().state().carrying),'registered photo is carried');
  }
  await register('縦写真の試験');
  api().inspect(0);
  assert(api().state().works.find(w=>w.title==='縦写真の試験').fixtureId==='frame-0-0','first exhibit linked via fixture ID');
  await register('交換テスト');
  api().inspect(0);
  const swappedFrame=api().state().fixtures.find(f=>f.id==='frame-0-0');
  assert(swappedFrame.imageScale===1&&swappedFrame.imageX===0&&swappedFrame.imageY===0,'exchange resets photo crop offsets');
  assert(Boolean(api().state().carrying),'exchange lifts previous work');
  api().inspect(1);
  assert(api().state().works.filter(w=>w.fixtureId).length===2,'exchange retains both works');
  api().inspect(0);
  doc.getElementById('editNote').click();
  doc.getElementById('editMemo').value='後から編集した思い出';
  doc.getElementById('saveMemo').click();
  assert(api().state().works.some(w=>w.notes==='後から編集した思い出'),'memo changed');
  doc.getElementById('close').click();
  api().inspect(0);
  doc.getElementById('inspectPhoto').click();
  assert(!doc.getElementById('photoViewer').hidden,'full-screen photo viewer opens');
  await until(()=>doc.getElementById('photoImage').naturalWidth>0,'viewer photo loaded');
  const vf=doc.getElementById('photoFrame'),vimg=doc.getElementById('photoImage');
  const fs=game.getComputedStyle(vf);
  assert(parseFloat(fs.borderTopWidth)>=7,'golden border wraps photo, not full screen');
  assert(vf.getBoundingClientRect().width<doc.getElementById('photoViewport').getBoundingClientRect().width-8,'framed photograph fits inside viewport');
  assert(game.getComputedStyle(doc.getElementById('photoViewport'),'::after').content==='none','no false frame around the entire screen');
  doc.getElementById('photoClose').click();
  doc.getElementById('close').click();
  const realFrame=api().state().fixtures.find(f=>f.id==='frame-0-0');
  const portraitArt=game.A18Art.frameBounds({...realFrame,imageMode:'contain'},{naturalWidth:30,naturalHeight:90},api().state().fixtures,'portrait');
  assert(portraitArt.shape==='portrait'&&portraitArt.h>portraitArt.w,'portrait frame displays the whole vertical photograph');
  assert(Math.abs(portraitArt.w/portraitArt.h-1/3)<.015,'portrait aperture follows source aspect without blank side strips');
  api().list();
  const target=api().state().works.find(w=>w.title==='縦写真の試験');
  assert(Boolean(target),'test work exists before deletion');
  doc.querySelector('[data-delete-work="'+target.id+'"]').click();
  assert(doc.getElementById('confirmDelete')&&doc.getElementById('cancelDelete'),'deletion requires explicit confirmation');
  doc.getElementById('cancelDelete').click();
  assert(api().state().works.length===2,'cancel preserves artwork');
  doc.querySelector('[data-delete-work="'+target.id+'"]').click();
  doc.getElementById('confirmDelete').click();
  await until(()=>api().state().works.length===1,'confirmed work deleted');
  assert(!api().state().works.some(w=>w.id===target.id),'deleted art removed from live list');
  assert(api().state().fixtures.find(f=>f.id==='frame-0-1').workId===null,'deleted art unlinked from exhibit');
  const afterDelete=await game.A18Storage.load();
  assert(afterDelete.works.length===1&&!afterDelete.works.some(w=>w.id===target.id),'deleted original Blob removed from saved state');
  doc.getElementById('close').click();
  assert(!('sort' in api()),'legacy rearrangement/sorting action has no gameplay entry');
  // Deterministic layouts always restore the established 28 coordinates.
  const legacy=L.defaults();legacy[0].x+=22;legacy[0].y+=15;
  assert(L.enforceFixedLayout(legacy)===1,'old movable fixture normalizes to fixed layout');
  assert(legacy[0].x===L.defaults()[0].x,'fixed layout uses original frame position');
  const invalid=L.defaults();invalid[0].x=invalid[1].x;
  assert(!L.validatePlacement(invalid,0).ok,'overlap rejected');
  await sleep(1500);
  frame.addEventListener('load',()=>{});
  frame.src='../index.html';
  await until(()=>api()?.ready()&&api().state().works.length===1&&api().state().avatarGender==='female','restored data');
  const restored=api().state();
  assert(restored.works.length===1,'remaining photo survives reload');
  assert(!restored.fixtures.some(f=>f.kind==='decor'),'decor was not introduced into fixed layout');
  assert(restored.fixtures.find(f=>f.id==='frame-0-0').imageMode==='contain','photo mode survives reload');
  assert(restored.fixtures.find(f=>f.id==='frame-0-0').x===L.defaults()[0].x,'fixed display position survives reload');
  assert(restored.playerName==='ゆう'&&restored.museumTitle==='ゆた美術館','name and museum title survive reload');
  assert(restored.avatarGender==='female','avatar survives reload');
  assert(restored.works.some(w=>w.notes==='後から編集した思い出'),'memo survives reload');
  // Verify the original blob and the viewer with restored images.
  assert(game.indexedDB!==undefined,'browser indexedDB available');
  const w=frame.contentWindow;
  const snap=await w.A18Storage.load();
  assert(snap.works.length===1&&snap.works.every(w=>w.originalBlob&&w.originalBlob.size>0),'remaining original photo blob preserved');
  assert(snap.works.every(w=>w.preferredShape==='portrait'),'orientation recommendation survives reload');
  assert(errors.length===0,'no window errors: '+errors.join(','));
  out.push('FINAL: ALL TESTS PASS');
 }catch(e){out.push('FAIL: '+e.stack);try{out.push('URL='+frame.contentWindow.location.href+' loaded='+api()?.ready()+' hint='+frame.contentWindow.document.getElementById('hint')?.textContent+' typeof L='+typeof frame.contentWindow.A18Layout+' storage='+typeof frame.contentWindow.A18Storage.load+' src='+frame.src)}catch(ignore){out.push('DIAGNOSTIC ERROR '+ignore)}out.push('BROWSER ERRORS: '+errors.join(' // '));}
 document.getElementById('result').textContent=out.join('\n');
 document.title=out.some(x=>x.startsWith('FAIL'))?'A18 TEST FAILED':'A18 TEST PASSED';
})();
</script></html>
