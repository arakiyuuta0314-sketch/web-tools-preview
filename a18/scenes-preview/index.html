<script>

let galleryIndex=0; // 0 = entrance, 1..5 = galleries 2..6.

 [[40,58,140,135],[216,58,316,135],[404,58,504,135]],
 [[42,58,140,134],[208,58,306,134],[418,58,516,134],[56,251,154,327],[405,251,503,327]],

 if(w.spot==null)return '保管中';

 if(!work)return null;
 const source=work.displaySrc||work.originalURL;
 if(!source)return null;
 let entry=workImageCache.get(work.id);
 if(entry?.source!==source){
   const img=new Image();

   img.src=source;

 return entry.img.complete&&entry.img.naturalWidth>0?entry.img:null;
}

 if(carrying)visible.add(carrying);
 for(const id of workImageCache.keys())if(!visible.has(id))workImageCache.delete(id);

const A18_FEMALE=new URLSearchParams(location.search).get('avatar')==='female';
const SPRITE_BOUNDS={"front0":{"x":10,"y":4,"w":42,"h":68},"front1":{"x":8,"y":3,"w":42,"h":69},"front2":{"x":6,"y":4,"w":43,"h":68},"front3":{"x":7,"y":4,"w":43,"h":68},"front4":{"x":9,"y":4,"w":42,"h":68},"back0":{"x":7,"y":3,"w":41,"h":63},"back1":{"x":6,"y":3,"w":42,"h":63},"back2":{"x":6,"y":3,"w":40,"h":63},"back3":{"x":7,"y":3,"w":40,"h":63},"back4":{"x":8,"y":3,"w":41,"h":63},"left0":{"x":13,"y":8,"w":40,"h":59},"left1":{"x":14,"y":8,"w":39,"h":59},"left2":{"x":15,"y":8,"w":38,"h":59},"left3":{"x":13,"y":8,"w":40,"h":60},"left4":{"x":11,"y":8,"w":41,"h":59},"right0":{"x":6,"y":2,"w":40,"h":56},"right1":{"x":6,"y":2,"w":39,"h":57},"right2":{"x":6,"y":2,"w":39,"h":57},"right3":{"x":6,"y":2,"w":40,"h":56},"right4":{"x":8,"y":2,"w":41,"h":57}};
async function getAlphaBounds(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(im,0,0);const a=cx.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=0,y1=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){if(a[(y*c.width+x)*4+3]>20){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+1);y1=Math.max(y1,y+1)}}return {x:x0,y:y0,w:x1-x0,h:y1-y0};}

 const toggle=document.createElement('button');toggle.textContent=A18_FEMALE?'館長：女性 ▼':'館長：男性 ▼';toggle.type='button';toggle.style.cssText='position:fixed;top:8px;right:8px;z-index:9999;padding:8px 12px;border-radius:8px;background:#f4dfb2;color:#183b31;border:2px solid #9e834b;font-weight:bold';toggle.onclick=()=>{const u=new URL(location.href);u.searchParams.set('avatar',A18_FEMALE?'male':'female');location.href=u.href};document.body.appendChild(toggle);

function isPortraitGame(){return matchMedia('(orientation:portrait) and (max-width:850px)').matches;}
