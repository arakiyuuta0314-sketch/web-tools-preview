<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('world'),ctx=canvas.getContext('2d'),overlay=$('overlay');
const src={entrance:{w:546,h:483,background:'entrance_base.webp',spawn:[195,313],name:'美術館の入口'},gallery:{w:589,h:482,background:'gallery_clean.png',spawn:[316,260],name:'第1展示室'}};
const ap=[[148,53,216,109],[258,54,332,110],[365,53,437,110]];
const works=[{id:'sample-1',title:'湖畔の風景（見本）',pieces:1000,complete:null,registered:'2026-10-22',source:0,spot:0},{id:'sample-2',title:'夕焼けの空（見本）',pieces:500,complete:'2025-05-10',registered:'2026-10-22',source:1,spot:1},{id:'sample-3',title:'花の庭園（見本）',pieces:300,complete:null,registered:'2026-10-22',source:2,spot:2}];
const NAME_KEY='a18-museum-name';let museumTitle='パズル美術館',viewMode='overview';
try{museumTitle=localStorage.getItem(NAME_KEY)||museumTitle;}catch(e){}
let scene='entrance',pos={x:195,y:313,dir:'up',stride:0},carrying=null,modal=false,cameraY=0,logicalH=290,frame=0,loaded=false,lastArrange=null;
const MOVE_DISTANCE=12,MOVE_REPEAT_MS=65,MOVE_SUBSTEP=3;
let activeInteraction=null;
const images=new Map(),spriteBounds=new Map(),movement={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',w:'up',a:'left',s:'down',d:'right'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slot=i=>works.find(w=>w.spot===i)||null,makeUrl=f=>URL.createObjectURL(f);
function image(name,url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{images.set(name,im);res()};im.onerror=()=>rej(new Error('画像の読込に失敗: '+url));im.src=url;});}
function get(name){return images.get(name);}
const SPRITE_BOUNDS={"front0":{"x":10,"y":4,"w":42,"h":68},"front1":{"x":8,"y":3,"w":42,"h":69},"front2":{"x":6,"y":4,"w":43,"h":68},"front3":{"x":7,"y":4,"w":43,"h":68},"front4":{"x":9,"y":4,"w":42,"h":68},"back0":{"x":7,"y":3,"w":41,"h":63},"back1":{"x":6,"y":3,"w":42,"h":63},"back2":{"x":6,"y":3,"w":40,"h":63},"back3":{"x":7,"y":3,"w":40,"h":63},"back4":{"x":8,"y":3,"w":41,"h":63},"left0":{"x":13,"y":8,"w":40,"h":59},"left1":{"x":14,"y":8,"w":39,"h":59},"left2":{"x":15,"y":8,"w":38,"h":59},"left3":{"x":13,"y":8,"w":40,"h":60},"left4":{"x":11,"y":8,"w":41,"h":59},"right0":{"x":6,"y":2,"w":40,"h":56},"right1":{"x":6,"y":2,"w":39,"h":57},"right2":{"x":6,"y":2,"w":39,"h":57},"right3":{"x":6,"y":2,"w":40,"h":56},"right4":{"x":8,"y":2,"w":41,"h":57}};
async function boot(){
 const loads=[image('entrance','assets/entrance_base.webp'),image('gallery','assets/gallery_clean.png'),image('staff','assets/staff-front.png')];
 for(let i=0;i<3;i++)loads.push(image('sample'+i,'assets/sample'+i+'.png'));
 for(const dir of ['front','back','left','right'])for(let i=0;i<5;i++)loads.push(image(dir+i,'assets/curator-'+dir+'-'+String(i).padStart(2,'0')+'.png'));
 await Promise.all(loads);
 for(const dir of ['front','back','left','right'])for(let i=0;i<5;i++){
  const id=dir+i;spriteBounds.set(id,SPRITE_BOUNDS[id]);
 }
 loaded=true;resize();update();requestAnimationFrame(draw);
 $('museumName').textContent=museumTitle;
 let first=true;try{first=!localStorage.getItem(NAME_KEY)}catch(e){}
 if(first)nameDialog(true);
}
function resize(){
 const b=$('stage').getBoundingClientRect();if(!b.width||!b.height)return;
 const m=src[scene];
 if(viewMode==='overview'){
  const scale=Math.min(b.width/m.w,b.height/m.h);
  const dw=Math.max(1,Math.floor(m.w*scale)),dh=Math.max(1,Math.floor(m.h*scale));
  canvas.width=m.w;canvas.height=m.h;canvas.style.width=dw+'px';canvas.style.height=dh+'px';
  $('stage').classList.add('overview');$('stage').style.setProperty('--side-width',Math.max(0,(b.width-dw)/2)+'px');
  logicalH=m.h;cameraY=0;
 }else{
  canvas.width=800;canvas.height=Math.max(1,Math.round(800*b.height/b.width));
  canvas.style.width='100%';canvas.style.height='100%';$('stage').classList.remove('overview');
  logicalH=canvas.height*m.w/800;
 }
 ctx.imageSmoothingEnabled=true;
}
function worldPoint(e){const b=canvas.getBoundingClientRect(),m=src[scene],k=m.w/b.width;return {x:(e.clientX-b.left)*k,y:(e.clientY-b.top)*k+(viewMode==='overview'?0:cameraY)};}
// Collision and interaction are intentionally separate.
const obstacles={
 entrance:[
  [54,312,81,184], // Reception desk and back wall
  [0,72,135,309],[0,73,310,441], // Planters/left balustrade
  [338,474,202,430], // Right banister and staircase
  [484,546,110,450], // East wall
  [0,546,0,62]
 ],
 gallery:[
  [0,589,0,139], // Wall and picture frames
  [112,225,144,195],[365,479,144,195], // Sofas
  [216,266,118,196],[327,380,118,197],[246,361,149,182], // Plants and the central display rope
  [238,345,274,389], // Angel statue and railing
  [110,164,279,374],[420,483,278,371], // Armchairs
  [163,219,266,349],[367,424,265,349], // Front marble pedestals
  [0,69,0,215],[520,589,0,210], // Side walls and lamps
  [0,121,381,482],[469,589,382,482] // Foreground staircase rails (prevent floor clipping)
 ]
};
function safeMove(x,y){
 const radius=8,m=src[scene];
 if(x<22||x>m.w-22||y<75||y>m.h-17)return false;
 for(const [left,right,top,bottom] of obstacles[scene]){
  const closestX=Math.max(left,Math.min(x,right)),closestY=Math.max(top,Math.min(y+5,bottom));
  if(Math.hypot(x-closestX,y+5-closestY)<radius)return false;
 }
 return true;
}
function inZone(x1,x2,y1,y2){return pos.x>=x1&&pos.x<=x2&&pos.y>=y1&&pos.y<=y2;}
function walk(dir){
 if(modal)return;
 const dx=dir==='right'?MOVE_DISTANCE:dir==='left'?-MOVE_DISTANCE:0;
 const dy=dir==='down'?MOVE_DISTANCE:dir==='up'?-MOVE_DISTANCE:0;
 pos.dir=dir;
 // Swept motion: use 3px substeps so higher speed cannot skip small obstacles.
 const ticks=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/MOVE_SUBSTEP);
 let moved=false;
 for(let i=0;i<ticks;i++){
  const nx=pos.x+dx/ticks,ny=pos.y+dy/ticks;
  if(!safeMove(nx,ny))break;
  pos.x=nx;pos.y=ny;moved=true;
 }
 if(moved){pos.stride=(pos.stride+1)%5;$('hint').hidden=true}
 update();
}
function interactionCandidates(){
 if(scene==='entrance')return[
  {type:'staff',x:195,y:191,enter:43,leave:58},
  {type:'door',x:401,y:197,enter:43,leave:57}
 ];
 return ap.map((rect,i)=>{
  const x=(rect[0]+rect[2])/2;
  return {type:'art',i,x,y:185,enter:38,leave:51};
 });
}
function interactionId(hit){return hit.type+':'+(hit.i??'')}
function nearby(){
 const items=interactionCandidates();
 if(activeInteraction){
  const keep=items.find(hit=>interactionId(hit)===interactionId(activeInteraction));
  if(keep&&Math.hypot(pos.x-keep.x,pos.y-keep.y)<=keep.leave){
   return activeInteraction=keep;
  }
  activeInteraction=null;
 }
 let chosen=null,best=Infinity;
 for(const hit of items){
  const distance=Math.hypot(pos.x-hit.x,pos.y-hit.y);
  if(distance<=hit.enter&&distance<best){chosen=hit;best=distance}
 }
 return activeInteraction=chosen;
}
function update(){
 $('sceneBtn').textContent=scene==='entrance'?'展示室へ':'入口へ';
 $('sceneBtn').setAttribute('aria-label',scene==='entrance'?'展示室へ移動':'美術館の入口へ移動');
 $('statusText').textContent=src[scene].name+' ／ 3展示枠 ／ 館 Lv.1';
 const hit=nearby();
 $('act').hidden=!hit;
 if(hit)$('act').textContent=hit.type==='staff'?'話しかける':hit.type==='door'?'展示室へ':carrying?'ここに飾る':'作品を調べる';
 $('cancel').hidden=!carrying;
}
function changeScene(next){if(!src[next])throw new Error('scene missing');scene=next;carrying=null;activeInteraction=null;pos={x:src[next].spawn[0],y:src[next].spawn[1],dir:next==='gallery'?'up':'down',stride:0};cameraY=0;$('hint').hidden=false;resize();update();}
function paintArtwork(a,i){
 const [x1,y1,x2,y2]=ap[i],w=x2-x1,h=y2-y1;
 // Each aperture has an independent opaque mount in gallery_clean.png.
 // Drawing never relies on the demonstration artwork embedded in older backgrounds.
 const pad=2,ix=x1+pad,iy=y1+pad,iw=w-2*pad,ih=h-2*pad;
 ctx.save();ctx.beginPath();ctx.rect(ix,iy,iw,ih);ctx.clip();
 ctx.fillStyle='#e8dfcb';ctx.fillRect(ix,iy,iw,ih);
 if(a){
  const img=a.photo || get('sample'+a.source);
  if(img&&img.width&&img.height){
   const ratio=Math.min(iw/img.width,ih/img.height);
   const drawW=img.width*ratio,drawH=img.height*ratio;
   ctx.drawImage(img,ix+(iw-drawW)/2,iy+(ih-drawH)/2,drawW,drawH);
  }
 }else{
  ctx.fillStyle='#9e8c71';ctx.font='bold 20px serif';ctx.textAlign='center';
  ctx.fillText('+',(x1+x2)/2,(y1+y2)/2+6);
 }
 ctx.restore();
}
function avatar(){
 const dir=pos.dir==='up'?'back':pos.dir==='down'?'front':pos.dir;
 const id=dir+(pos.stride%5),image=get(id),crop=spriteBounds.get(id);
 if(!image||!crop)return;
 const w=35,h=46;
 // Feet touch the ground baseline; remove transparent margins from original sheets.
 ctx.fillStyle='#1b292147';ctx.beginPath();ctx.ellipse(pos.x,pos.y+1,13,3.2,0,0,Math.PI*2);ctx.fill();
 ctx.drawImage(image,crop.x,crop.y,crop.w,crop.h,pos.x-w/2,pos.y-h,w,h);
 if(carrying){const art=works.find(w=>w.id===carrying),sample=art?.photo||get('sample'+art?.source);
 ctx.fillStyle='#9a6739';ctx.fillRect(pos.x-20,pos.y-h-34,40,30);ctx.fillStyle='#fff8e8';ctx.fillRect(pos.x-17,pos.y-h-31,34,24);
 if(sample){const r=Math.min(34/sample.width,24/sample.height);ctx.drawImage(sample,pos.x-sample.width*r/2,pos.y-h-31+(24-sample.height*r)/2,sample.width*r,sample.height*r);}
 }
}
function draw(){
 if(!loaded)return;
 const m=src[scene],maxY=Math.max(0,m.h-logicalH),desired=Math.max(0,Math.min(maxY,pos.y-logicalH*.70));
 if(viewMode==='overview')cameraY=0;else cameraY+=Math.max(-14,Math.min(14,(desired-cameraY)*.25));
 ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();const scale=canvas.width/m.w;ctx.setTransform(scale,0,0,scale,0,-cameraY*scale);
 ctx.drawImage(get(scene),0,0,m.w,m.h);
 if(scene==='entrance'){const staff=get('staff');if(staff){ctx.drawImage(staff,174,65,36,54);}}
 if(scene==='gallery'){for(let i=0;i<3;i++)paintArtwork(slot(i),i);}
 const hit=nearby();if(scene==='gallery'&&hit?.type==='art'&&carrying){const [x1,y1,x2,y2]=ap[hit.i];ctx.strokeStyle='#b9ebca';ctx.lineWidth=3;ctx.strokeRect(x1-6,y1-6,x2-x1+12,y2-y1+12);}
 avatar();ctx.restore();requestAnimationFrame(draw);
}
function nameDialog(first=false){
 open(first?'美術館の名前を決めよう':'美術館の名前を変更',
 '<p>あなたの美術館に名前を付けましょう。あとから変更できます。</p>'+
 '<label>美術館の名前<input id="newMuseumName" maxlength="24" value="'+esc(museumTitle)+'"></label>'+
 '<p id="nameError" class="error"></p><div class="row"><button id="confirmName">この名前で始める</button>'+
 (first?'':'<button id="close" class="light">キャンセル</button>')+'</div>');
 $('confirmName').onclick=()=>{
  const next=$('newMuseumName').value.trim();
  if(!next){$('nameError').textContent='美術館の名前を入力してください';return;}
  museumTitle=next;$('museumName').textContent=next;$('museumName').title=next+'（タップで名前を変更）';
  try{localStorage.setItem(NAME_KEY,next)}catch(e){}
  close();
 };
 if(!first)$('close').onclick=close;
}
function open(title,contents){modal=true;$('dialog').innerHTML='<h2>'+esc(title)+'</h2>'+contents;overlay.hidden=false;}
function close(){modal=false;overlay.hidden=true;update();}
function action(){const h=nearby();if(!h)return;if(scene==='entrance'){
 if(h?.type==='staff')staffDialog();else if(h?.type==='door')changeScene('gallery');else open('美術館の入口','<p>展示室へ進むか、受付スタッフに話しかけてください。</p><div class="row"><button id="enter">展示室へ</button><button id="close" class="light">閉じる</button></div>');
 if($('enter'))$('enter').onclick=()=>{close();changeScene('gallery')};if($('close'))$('close').onclick=close;return;
 }
 if(h?.type==='art')inspect(h.i);else{$('hint').hidden=false;update();}
}
function inspect(i){
 if(carrying){const a=works.find(w=>w.id===carrying);if(!a){carrying=null;return;}
  const b=slot(i);if(b&&b.id!==a.id)b.spot=a.spot;a.spot=i;carrying=null;update();return;
 }
 const a=slot(i);if(!a){form(i);return;}
 open(a.title,'<p>完成日：'+esc(a.complete||'不明')+'　登録日：'+esc(a.registered)+'<br>ピース：'+esc(a.pieces||'未登録')+'</p><div class="row"><button id="lift">頭上に持ち上げる</button><button id="view" class="light">作品を見る</button><button id="close" class="light">閉じる</button></div>');
 $('lift').onclick=()=>{carrying=a.id;close()};$('view').onclick=()=>{let src=a.photo?.src||get('sample'+a.source)?.src;open(a.title,'<img alt="展示写真" style="width:100%;max-height:55dvh;object-fit:contain" src="'+src+'"><div class="row"><button id="close" class="light">戻る</button></div>');$('close').onclick=()=>inspect(i)};$('close').onclick=close;
}
function list(){
 open('作品一覧','<p class="small">画像素材制作段階：この比較版の登録枠は3つ。元の50作品版は維持しています。</p><div class="artlist">'+[0,1,2].map(i=>{const a=slot(i);return '<div class="artitem"><span><b>'+(i+1)+'. '+esc(a?.title||'展示なし')+'</b><br><small>完成日：'+esc(a?.complete||'不明')+'</small></span><button data-open="'+i+'">開く</button></div>'}).join('')+'</div><div class="row"><button id="close" class="light">戻る</button></div>');
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{changeScene('gallery');inspect(Number(b.dataset.open))});$('close').onclick=close;
}
function staffDialog(){open('館スタッフ','<p>いらっしゃいませ！ 作品の一覧や並べ替えをご案内します。</p><div class="row"><button id="all">作品一覧</button><button id="sort">自動で並べ替え</button><button id="close" class="light">閉じる</button></div>');$('all').onclick=list;$('sort').onclick=sortDialog;$('close').onclick=close;}
function sortDialog(){open('展示品の並べ替え','<label>並べ替えの基準<select id="sortKind"><option value="complete">完成日順</option><option value="registered">登録順</option></select></label><label>順序<select id="sortOrder"><option value="asc">古い順</option><option value="desc">新しい順</option></select></label><p class="small">完成日が不明な場合だけ、登録日を並べ替えに使用します。</p><div class="row"><button id="apply">並べ替える</button><button id="close" class="light">戻る</button></div>');$('apply').onclick=()=>{const kind=$('sortKind').value,order=$('sortOrder').value;lastArrange=works.map(a=>[a.id,a.spot]);const sorted=[...works].filter(a=>a.spot!=null).sort((a,b)=>{const da=kind==='registered'?a.registered:(a.complete||a.registered),db=kind==='registered'?b.registered:(b.complete||b.registered);return order==='asc'?da.localeCompare(db):db.localeCompare(da)});sorted.forEach((a,i)=>a.spot=i);close();changeScene('gallery');fade();};$('close').onclick=staffDialog;}
function fade(){const fade=document.createElement('div');fade.style.cssText='position:fixed;z-index:19;inset:0;background:#102d27;opacity:1;transition:opacity .4s;pointer-events:none';document.body.appendChild(fade);requestAnimationFrame(()=>fade.style.opacity='0');setTimeout(()=>fade.remove(),440);}
function form(spotNo=0){open('作品を登録して飾る','<p class="small">好きな写真でテストできます。再読み込みで消える一時データです。</p><label>展示枠<select id="spot"><option value="0">左の額縁</option><option value="1">中央の額縁</option><option value="2">右の額縁</option></select></label><label>作品名<input id="name" placeholder="例：お気に入りの写真"></label><label>完成日<select id="mode"><option value="unknown">不明</option><option value="known">分かる</option></select></label><label id="dateWrap" hidden>完成日<input id="date" type="date"></label><label>ピース数（任意）<input id="pieces" type="number" min="1"></label><label>写真<input id="photo" type="file" accept="image/*"></label><p id="err" class="error"></p><div class="row"><button id="save">写真を飾る</button><button id="close" class="light">キャンセル</button></div>');
 $('spot').value=String(spotNo);$('mode').onchange=()=>$('dateWrap').hidden=$('mode').value==='unknown';$('close').onclick=close;
 $('save').onclick=()=>{const file=$('photo').files?.[0],name=$('name').value.trim(),index=Number($('spot').value),completed=$('mode').value==='known' ?$('date').value:null;
 if(!name||!file||!file.type.startsWith('image/')){$('err').textContent='作品名と写真を選択してください';return;}if($('mode').value==='known'&&!completed){$('err').textContent='完成日を入力してください';return;}
 const url=makeUrl(file),img=new Image();img.onload=()=>{const existing=slot(index);if(existing)works.splice(works.indexOf(existing),1);
 works.push({id:'local-'+Date.now(),title:name,pieces:Number($('pieces').value)||null,complete:completed,registered:new Date().toLocaleDateString('sv-SE'),photo:img,spot:index,source:null});close();changeScene('gallery');};img.onerror=()=>{$('err').textContent='写真を読めませんでした';URL.revokeObjectURL(url)};img.src=url;};
}
const heldKeys=new Set();let pointerLoop=null;
$('museumName').onclick=()=>nameDialog(false);
$('viewMode').onclick=()=>{viewMode=viewMode==='overview'?'zoom':'overview';$('viewMode').textContent=viewMode==='overview'?'拡大表示':'全体表示';$('viewMode').setAttribute('aria-pressed',viewMode==='overview'?'true':'false');resize();};
$('act').onclick=action;$('sceneBtn').onclick=()=>changeScene(scene==='entrance'?'gallery':'entrance');$('showList').onclick=list;$('addPhoto').onclick=()=>form(0);$('cancel').onclick=()=>{carrying=null;update()};
overlay.onclick=e=>{if(e.target===overlay)close()};
canvas.onclick=e=>{if(modal||scene!=='gallery')return;const h=nearby();if(h?.type==='art'){const pt=worldPoint(e),[x1,y1,x2,y2]=ap[h.i];if(pt.x>x1-28&&pt.x<x2+28&&pt.y>y1-31&&pt.y<y2+55)inspect(h.i);}};
window.addEventListener('keydown',e=>{if(modal)return;if(movement[e.key]){e.preventDefault();heldKeys.add(e.key);if(!e.repeat)walk(movement[e.key])}else if(e.key==='Enter'){e.preventDefault();action()}});
window.addEventListener('keyup',e=>heldKeys.delete(e.key));
window.addEventListener('blur',()=>heldKeys.clear());document.addEventListener('visibilitychange',()=>{if(document.hidden){heldKeys.clear();clearInterval(pointerLoop)}});
setInterval(()=>{if(!modal&&heldKeys.size){const key=[...heldKeys].at(-1);walk(movement[key]);}},MOVE_REPEAT_MS);
for(const b of document.querySelectorAll('[data-d]')){const stop=()=>{clearInterval(pointerLoop);pointerLoop=null};b.onpointerdown=e=>{e.preventDefault();stop();walk(b.dataset.d);pointerLoop=setInterval(()=>walk(b.dataset.d),MOVE_REPEAT_MS);if(b.setPointerCapture)b.setPointerCapture(e.pointerId)};for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,stop);}
for(const ev of ['contextmenu','selectstart','dragstart'])$('dpad').addEventListener(ev,e=>e.preventDefault());$('dpad').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',resize);
window.__A18_SCENE_STUDY__={state:()=>({scene,pos:{...pos},carrying,museumTitle,viewMode,interaction:nearby(),movement:{step:MOVE_DISTANCE,repeatMs:MOVE_REPEAT_MS},works:works.map(a=>({id:a.id,spot:a.spot,title:a.title,complete:a.complete}))}),move:walk,canMove:safeMove,changeScene,inspect,sort:(kind='complete',order='asc')=>{lastArrange=works.map(a=>[a.id,a.spot]);const sorted=[...works].sort((a,b)=>{const akey=kind==='registered'?a.registered:(a.complete||a.registered),bkey=kind==='registered'?b.registered:(b.complete||b.registered);return order==='asc'?akey.localeCompare(bkey):bkey.localeCompare(akey)});sorted.forEach((a,i)=>a.spot=i);},restore:()=>{if(lastArrange)for(const [id,spot]of lastArrange){const a=works.find(a=>a.id===id);if(a)a.spot=spot;}},ready:()=>loaded};
boot().catch(e=>{$('hint').textContent=e.message;console.error(e)});
})();
