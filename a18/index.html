<script>
/* A18 original pixel-illustration renderer v0.2: no external assets */
window.A18Visuals=(()=>{
const C={ink:'#334b47',wall:'#dfd6c5',wallTop:'#e9e4d7',floor:'#d6cbb2',stone:'#bca985',light:'#f9edcd',gold:'#d7b87b',brass:'#98734d',emerald:'#376b60',sage:'#80a192',wood:'#7d5944',darkWood:'#553e35',cream:'#fbf3df',plum:'#734b52'};
const rect=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));};
const line=(g,x,y,w,h,c)=>rect(g,x,y,w,h,c);
function text(g,s,x,y,size=18,color=C.ink,weight='700',align='center'){g.textAlign=align;g.textBaseline='middle';g.font=`${weight} ${size}px system-ui, sans-serif`;g.fillStyle=color;g.fillText(s,x,y);}
function frame(g,x,y,w,h,c=C.gold){rect(g,x-7,y-7,w+14,h+14,C.darkWood);rect(g,x-4,y-4,w+8,h+8,c);rect(g,x,y,w,h,C.cream);rect(g,x-7,y-7,13,5,'#f9dfa4');rect(g,x+w-6,y+h+2,13,5,C.brass);}
function column(g,x,y,height){rect(g,x,y,28,height,'#b3a38b');rect(g,x+4,y,20,height,'#ebe2cb');rect(g,x-5,y,38,9,'#c2af89');rect(g,x-5,y+height-13,38,13,'#bba684');rect(g,x+7,y+17,4,height-40,'#fff9e4');}
function floor(g,x,y,w,h,kind=0){rect(g,x,y,w,h,['#d7cab1','#d9d0bb','#c7cab8','#e1d4b9','#d4cec2'][kind%5]);for(let iy=0;iy<Math.ceil(h/64);iy++){for(let ix=0;ix<Math.ceil(w/64);ix++){const xx=x+ix*64, yy=y+iy*64, ck=(ix*5+iy*3)%5;rect(g,xx,yy,63,63,ck%2?'#ffffff0d':'#85755913');rect(g,xx,yy,64,1,'#f6ecd09c');rect(g,xx,yy,1,64,'#8874513d');if((ix+iy)%4===0){rect(g,xx+12,yy+12,5,5,'#fff9e74a');rect(g,xx+42,yy+37,4,4,'#7966472a');}}}}
function carpet(g,x,y,w,h,main=C.emerald){rect(g,x-7,y-7,w+14,h+14,C.gold);rect(g,x,y,w,h,main);rect(g,x+9,y+9,w-18,h-18,'#467c70');for(let iy=y+20;iy<y+h-20;iy+=34){rect(g,x+16,iy,6,6,C.gold);rect(g,x+w-22,iy,6,6,C.gold);}rect(g,x+w/2-4,y+5,8,h-10,'#d4b67c32');}
function plant(g,x,y,s=1){g.save();g.translate(x,y);g.scale(s,s);rect(g,-15,6,30,18,'#7c5644');rect(g,-12,4,24,16,'#b68768');rect(g,-4,-40,9,48,'#52765a');for(const [dx,dy,r,c] of [[-20,-28,14,'#4a8365'],[15,-37,16,'#538c6d'],[-5,-53,18,'#86aa7a'],[5,-21,13,'#659a78'],[-24,-46,10,'#719769']]){rect(g,dx-r/2,dy-r/2,r,r,c);rect(g,dx-r/2+3,dy-r/2+2,r/2,r/4,'#b4c799');}g.restore();}
function torch(g,x,y){rect(g,x-7,y,14,8,C.wood);rect(g,x-4,y-7,8,16,C.brass);rect(g,x-8,y-15,16,9,'#edcc84');rect(g,x-4,y-23,8,12,'#fff2b1');}
function plaque(g,label,x,y,w=148){rect(g,x-w/2-4,y-16,w+8,33,C.darkWood);rect(g,x-w/2,y-13,w,27,C.brass);text(g,label,x,y+1,15,'#fff4d8');}
function arch(g,x,y){ // Museum interior portal
 rect(g,x-125,y,250,190,C.darkWood);rect(g,x-118,y,236,179,'#ab845b');rect(g,x-105,y+12,210,167,C.gold);rect(g,x-98,y+18,196,154,'#335e56');rect(g,x-91,y+27,182,145,'#4a786a');rect(g,x-19,y+27,38,145,'#28453f');rect(g,x-105,y+12,210,9,'#ffe0a3');rect(g,x-129,y+184,258,13,C.brass);rect(g,x-56,y+64,112,59,'#254d44');text(g,'展示室へ',x,y+94,21,'#f8edce');
}
function drawEntrance(g,W,H,n,level){rect(g,0,0,W,H,'#465a4f');g.save();g.translate((W-1060)/2,0);
 // upper wall and terrazzo entry floor
 rect(g,0,0,1060,134,'#d6c5a8');rect(g,0,0,1060,19,C.darkWood);rect(g,0,20,1060,8,C.brass);for(let x=36;x<1060;x+=94){rect(g,x,61,54,46,'#c5b18d');rect(g,x+4,65,46,38,'#e7d6b7');}
 floor(g,58,105,944,465);rect(g,58,105,944,10,C.gold);rect(g,55,105,10,465,C.brass);rect(g,994,105,10,465,C.brass);rect(g,58,562,944,10,C.brass);
 carpet(g,458,281,134,262,'#5e7468');for(const x of [103,930]){column(g,x,100,456);plant(g,x+18,480,1.5);}
 arch(g,525,85);plaque(g,'PUZZLE MUSEUM',525,66,258);torch(g,359,183);torch(g,693,183);
 // Reception counter and staff (staff drawn by scene main only)
 rect(g,224,239,237,102,C.wood);rect(g,226,239,233,16,'#ad8468');rect(g,235,258,214,60,'#d9c39f');rect(g,235,320,214,18,'#ad845f');rect(g,249,327,188,8,C.darkWood);text(g,'総合受付',342,336,15,C.cream);
 rect(g,278,201,123,25,C.darkWood);rect(g,282,204,115,19,C.light);text(g,'ご案内',339,213,17,C.ink);
 // Memorial stone plinth
 rect(g,633,221,135,123,'#7c948d');rect(g,640,210,121,125,'#9dafa1');rect(g,648,217,105,108,'#d2dfc6');rect(g,652,222,97,5,'#e8f2db');rect(g,648,325,105,6,'#74877c');text(g,'美術館の記録',700,247,16,C.ink);text(g,`${n} 作品`,700,286,21,C.ink);text(g,`館 Lv.${level}`,700,308,15,C.ink);
 for(const xx of [160,838]){plant(g,xx,328,1.24);rect(g,xx-32,396,64,5,C.brass);}
 rect(g,247,398,566,4,'#907955');text(g,'完成の喜びを、いつまでも。',530,430,19,'#52695b');text(g,'展示室で作品を持ち上げて並べ替えましょう',530,457,15,'#6a7568');
 g.restore();}

function pixDiamond(g,x,y,r,fill){
 g.fillStyle=fill;g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y);g.lineTo(x,y+r);g.lineTo(x-r,y);g.closePath();g.fill();
}
function archPortal(g,x,y,w,h,open,title){
 // Heavy oak portal, a luminous archway when the next gallery is unlocked.
 g.save();
 g.fillStyle='#1a302c';g.fillRect(x-9,y-9,w+18,h+18);
 g.fillStyle='#a98353';g.fillRect(x-5,y-5,w+10,h+10);
 g.fillStyle=open?'#426960':'#203c36';g.fillRect(x,y,w,h);
 if(open){
   for(let i=0;i<10;i++){g.fillStyle=i%2?'#8a665120':'#eee0c81d';g.fillRect(x+10+i*22,y+8,10,h-16);}
   g.fillStyle='#d3b879';g.fillRect(x+8,y+7,w-16,6);
 }else{
   for(let i=0;i<12;i++){g.fillStyle=i%2?'#18372f':'#2d6558';g.fillRect(x+i*w/12,y,w/12+1,h);}
   g.fillStyle='#d4bb79';g.fillRect(x+5,y+6,w-10,7);
 }
 g.fillStyle='#e8cb89';g.fillRect(x-8,y-7,w+16,5);
 if(title){plaque(g,title,x+w/2,y+h*.51,Math.min(w-14,170));}
 g.restore();
}
function muralCeiling(g,z,theme){
 const x=z.x,y=z.y,w=z.w,h=z.h;
 // Faceted shadow makes the room read as a space, not an endless row of frames.
 g.fillStyle='#1328248c';g.fillRect(x-14,y-14,w+29,h+29);
 g.fillStyle='#5a5947';g.fillRect(x-5,y-5,w+11,h+11);
 g.fillStyle='#b48e55';g.fillRect(x,y,w,h);
 g.fillStyle='#eadcc3';g.fillRect(x+15,y+16,w-30,h-34);
 // Museum floors are pale marble with alternating polished inlay rather than a regular grid.
 const floorY=y+301;
 g.fillStyle=theme.floor;g.fillRect(x+26,floorY,w-52,h-338);
 for(let r=floorY;r<y+h-36;r+=58){
  for(let c=x+28;c<x+w-31;c+=76){
