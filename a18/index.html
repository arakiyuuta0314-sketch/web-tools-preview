<script>
/* A18 Puzzle Museum - Web-first interactive prototype. Session-only demo data. */
(()=>{'use strict';
const $=(id)=>document.getElementById(id);
const canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false}),W=1060,H=590;
const room={w:1770,h:1180}, sampleDate='2026-10-22';
const slots=Array.from({length:50},(_,i)=>({id:`spot-${String(i+1).padStart(2,'0')}`,x:177+(i%10)*151,y:187+Math.floor(i/10)*185}));
const initial=[
 {id:'sample-1',title:'湖畔の風景（見本）',pieces:1000,completed:null,registered:'2026-10-20',memo:'写真を登録して置き換えてね',sample:0,spot:slots[0].id},
 {id:'sample-2',title:'花の庭園（見本）',pieces:500,completed:'2025-05-10',registered:'2026-10-21',memo:'実際のパズル作品ではありません',sample:1,spot:slots[1].id},
 {id:'sample-3',title:'夜空の星（見本）',pieces:300,completed:null,registered:'2026-10-22',memo:'仮の作品です',sample:2,spot:slots[2].id}
];
let arts=initial.map(a=>({...a})),serial=10,scene='entrance',pos={x:525,y:430,dir:'up',stride:0},carry=null,sortUndo=null,modal=null,photoDraft=null;
let pointerLoop=null,heldKeys=new Set(),noticeTimer=0,transitioning=false;
const imageCache=new Map();const entrance={staff:{x:348,y:277},stone:{x:690,y:268},door:{x:525,y:125}};
function level(){const n=arts.length;return Math.min(9,1+Math.floor(n/6));}
function unlocked(){return Math.min(50,6*level());}
function today(){return new Date().toLocaleDateString('sv-SE');}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function displayDate(a){return a.completed||'不明';}
function getArt(id){return arts.find(a=>a.id===id)||null;}
function atSpot(id){return arts.find(a=>a.spot===id)||null;}
function spotById(id){return slots.find(s=>s.id===id)||null;}
function titleBar(){$('displayCount').textContent=`${arts.length} / 50作品`;$('levelText').textContent=`館 Lv.${level()}`;$('roomTitle').textContent=scene==='gallery'?'第1展示室':'美術館の入口';$('sceneLabel').textContent=scene==='gallery'?'木漏れ日の展示室':'美術館のエントランス';$('sceneIcon').textContent=scene==='gallery'?'✦':'❖';}
function say(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),2400);}
function writeModal(title,kicker,inner){$('dialog').innerHTML=`<div class="modalbar"><div><small>${esc(kicker)}</small><h2 id="modalTitle">${esc(title)}</h2></div><button class="x" type="button" id="dismiss" aria-label="閉じる">×</button></div>${inner}`;$('overlay').hidden=false;modal=title;$('dismiss').onclick=closeModal;}
function closeModal(){$('overlay').hidden=true;modal=null;photoDraft=null;}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
function sceneTo(next){if(transitioning)return;transitioning=true;const fade=$('fade');fade.classList.add('show');setTimeout(()=>{scene=next;pos=next==='gallery'?{x:525,y:393,dir:'up',stride:0}:{x:525,y:430,dir:'up',stride:0};carry=null;titleBar();$('stageNote').textContent=next==='gallery'?'作品の近くで「調べる」を押す':'スタッフか石碑に近づこう';setTimeout(()=>{fade.classList.remove('show');transitioning=false;},200)},240)}
function screenCam(){return scene==='entrance'?{x:0,y:0}: {x:Math.max(0,Math.min(room.w-W,pos.x-W/2)),y:Math.max(0,Math.min(room.h-H,pos.y-H/2))};}
function isNear(x,y,r=118){return Math.hypot(pos.x-x,pos.y-y)<r;}
function closest(){if(scene==='entrance'){for(const [name,p] of Object.entries(entrance))if(isNear(p.x,p.y,name==='door'?138:124))return{kind:name};return null;}
 const available=slots.slice(0,unlocked());let best=null,bestDistance=150;for(const s of available){const distance=Math.hypot(pos.x-s.x,pos.y-(s.y+63));if(distance<bestDistance){best={kind:'spot',slot:s};bestDistance=distance;}}return best;}
function act(){if(modal||transitioning)return;const thing=closest();if(carry){if(!thing||thing.kind!=='spot'){say('展示スポットの近くで「置く」を押してね');return;}return place(thing.slot.id);}if(!thing){say('受付・石碑・展示品に近づいてみよう');return;}if(thing.kind==='door')return sceneTo('gallery');if(thing.kind==='staff')return staff();if(thing.kind==='stone')return stone();if(thing.kind==='spot')return spotAction(thing.slot.id);}
function updateAct(){const thing=closest();$('carryCancel').hidden=!carry;const label=carry?(thing?.kind==='spot'?'ここに置く':'展示場所を探す'):(thing?.kind==='door'?'展示室へ':thing?.kind==='staff'?'スタッフと話す':thing?.kind==='stone'?'石碑を読む':thing?.kind==='spot'?'作品を調べる':'調べる');$('action').textContent=label;}
function walk(direction){if(modal||transitioning)return;const delta=20;let x=pos.x,y=pos.y;pos.dir=direction;pos.stride=(pos.stride+1)%4;if(direction==='up')y-=delta;if(direction==='down')y+=delta;if(direction==='left')x-=delta;if(direction==='right')x+=delta;
 if(scene==='gallery'){pos.x=Math.max(65,Math.min(room.w-65,x));pos.y=Math.max(90,Math.min(room.h-68,y));}else{pos.x=Math.max(90,Math.min(970,x));pos.y=Math.max(154,Math.min(505,y));}updateAct();}
function photoImg(data){if(!data)return null;if(!imageCache.has(data)){const im=new Image();im.src=data;imageCache.set(data,im)}return imageCache.get(data);}
function box(x,y,w,h,fill,stroke){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.strokeRect(x,y,w,h);}}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function label(txt,x,y,font='bold 18px sans-serif',fill='#f1ead4',align='center'){ctx.font=font;ctx.fillStyle=fill;ctx.textAlign=align;ctx.fillText(txt,x,y);}
function mosaic(x,y,w,h,t){const palettes=[['#8fbab3','#e8d1a6','#719291','#425f71'],['#e2a98b','#fae3b4','#849b7d','#9b6b88'],['#718aa7','#d2c8bf','#3e5d89','#bdb2ba']];const p=palettes[t%3];box(x,y,w,h,p[0]);box(x,y+h*.55,w,h*.45,p[1]);ctx.fillStyle=p[2];ctx.beginPath();ctx.moveTo(x,y+h*.9);ctx.lineTo(x+w*.28,y+h*.27);ctx.lineTo(x+w*.53,y+h*.8);ctx.lineTo(x+w*.77,y+h*.2);ctx.lineTo(x+w,y+h*.88);ctx.closePath();ctx.fill();box(x+w*.09,y+h*.13,w*.11,h*.14,p[3]);}
function faceArt(a,x,y,w,h){const im=photoImg(a?.image);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();box(x,y,w,h,'#e7e4d4');if(im&&im.complete&&im.naturalWidth){const factor=Math.min(w/im.width,h/im.height),cw=im.width*factor,ch=im.height*factor;ctx.drawImage(im,x+(w-cw)/2,y+(h-ch)/2,cw,ch);}else mosaic(x,y,w,h,a?.sample??1);ctx.restore()}
function drawFloor(offsetX,offsetY,aw,ah,tint){box(offsetX,offsetY,aw,ah,tint);for(let x=offsetX;x<offsetX+aw;x+=46)for(let y=offsetY;y<offsetY+ah;y+=46){if((Math.floor((x-offsetX)/46)+Math.floor((y-offsetY)/46))%2===0)box(x,y,45,45,'#d7cfb988');}}
function drawEntrance(){box(0,0,W,H,'#7e9d8d');for(let i=0;i<15;i++){box(18+i*71,60,31,29,i%2?'#799484':'#a6b8a0')}drawFloor(115,75,830,460,'#ddd6bb');box(115,75,830,14,'#9c8465');box(115,75,14,462,'#9c8465');box(932,75,13,462,'#9c8465');box(115,525,830,11,'#9c8465');round(385,84,280,96,14,'#ead6aa');box(398,95,254,11,'#a58958');label('PUZZLE MUSEUM',525,142,'bold 26px Georgia','#675b45');round(443,181,164,55,12,'#496e60');label('展示室へ',525,216,'bold 22px sans-serif','#f5ead6');box(434,242,182,3,'#d1ba88');
 // staff booth
 round(255,233,185,102,11,'#bea17b');round(274,250,147,60,8,'#e4cf9e');label('受付スタッフ',350,330,'bold 15px sans-serif','#4a564b');drawNPC(346,277,'#7d97a1');
 // commemorative stone
 round(636,214,113,110,8,'#8e9f98');round(647,227,91,84,4,'#c3d1bf');label('記録',690,253,'bold 24px sans-serif','#435b50');label(`${arts.length} 作品`,690,286,'bold 17px sans-serif','#435b50');
 label('作品を記録して、あなただけの美術館に。',525,394,'bold 18px sans-serif','#42574d');label('入口スタッフ：作品一覧・並べ替え',525,426,'15px sans-serif','#52685a');}
function drawNPC(x,y,clothes='#597f72'){ctx.fillStyle='#2d4e493c';ctx.beginPath();ctx.ellipse(x,y+19,20,8,0,0,Math.PI*2);ctx.fill();round(x-17,y-9,34,34,6,clothes);round(x-13,y-36,27,28,8,'#efc39c');round(x-15,y-39,30,9,5,'#504c45');box(x-6,y+21,11,10,'#4b5047');box(x+6,y+21,11,10,'#4b5047');}
function drawGallery(){box(0,0,room.w,room.h,'#475d4f');drawFloor(45,48,room.w-90,room.h-92,level()>5?'#dbd9c8':'#d4cbb5');const bright=level()>4?'#d9be84':'#aa9870';box(45,48,room.w-90,25,bright);box(45,48,25,room.h-96,bright);box(room.w-70,48,25,room.h-96,bright);box(45,room.h-74,room.w-90,25,bright);

function nearestVisualTarget(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const cam=screenCam(),wx=x+cam.x,wy=y+cam.y;if(scene==='entrance'){if(Math.hypot(wx-entrance.staff.x,wy-entrance.staff.y)<94)return{kind:'staff'};if(Math.hypot(wx-entrance.stone.x,wy-entrance.stone.y)<98)return{kind:'stone'};if(Math.hypot(wx-entrance.door.x,wy-entrance.door.y)<104)return{kind:'door'};}else{const s=slots.slice(0,unlocked()).find(s=>Math.abs(wx-s.x)<66&&Math.abs(wy-s.y)<69);if(s)return{kind:'spot',slot:s};}return null;}

function place(dest){if(!carry)return;const src=getArt(carry.id),s=spotById(dest),from=carry.origin;if(!src||!s||slots.indexOf(s)>=unlocked()){say('ここには展示できません');return;}const other=atSpot(dest);if(dest===from){carry=null;say('元の場所に戻しました');return;}

function stone(){const known=arts.filter(a=>a.completed),pieces=arts.reduce((s,a)=>s+(Number.isFinite(a.pieces)?a.pieces:0),0);writeModal('美術館の記録','MEMORIAL STONE',`<div class="metrics"><div class="metric"><small>登録作品</small><b>${arts.length}</b></div><div class="metric"><small>合計ピース数</small><b>${pieces.toLocaleString('ja-JP')}</b></div><div class="metric"><small>館レベル</small><b>Lv.${level()}</b></div></div><p>称号：${level()>=7?'大パズルマニア':level()>=4?'コレクター':level()>=2?'作品収集家':'新米館長'}</p><p class="tip">完成日が「不明」の作品は、完成年の記録には含めません。完成日が分かる作品：${known.length}点</p>`)}
function galleryList(){const items=arts.map(a=>`<div class="artitem"><div class="thumb" style="display:grid;place-items:center;color:#586c5d">${a.image?`<img class="thumb" src="${a.image}" alt="">`:'🖼️'}</div><div class="meta"><b>${esc(a.title)}</b><small>完成日：${esc(displayDate(a))} ／ ${esc(a.pieces||'不明')}ピース ／ ${a.spot?'展示中':'未展示'}</small></div><button data-look="${esc(a.id)}">見る</button></div>`).join('');writeModal('作品一覧','YOUR COLLECTION',`<div class="artlist">${items||'<div class="empty">まだ作品がありません</div>'}</div><div class="rowbtn"><button class="btn" id="listSort">並べ替え</button><button class="btn primary2" id="listAdd">＋ 作品を登録</button></div>`);$('dialog').querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>detail(b.dataset.look));$('listSort').onclick=sortDialog;$('listAdd').onclick=()=>registerForm();}
function sortDialog(){writeModal('展示品を並べ替える','MUSEUM STAFF',`<p>「どの順番で並べましょうか？」</p><div class="field">並べ替える基準<div class="choiceGrid"><label><input type="radio" name="sortKey" value="completed" checked>完成日順</label><label><input type="radio" name="sortKey" value="registered">登録順</label></div></div><div class="field">並び順<div class="choiceGrid"><label><input type="radio" name="sortDir" value="desc" checked>新しい順</label><label><input type="radio" name="sortDir" value="asc">古い順</label></div></div><p class="tip">完成日が「不明」の作品は、登録日を代わりに使います。写真や作品情報そのものは変わりません。</p><div class="rowbtn">${sortUndo?'<button class="btn" id="undoSort">前の並びに戻す</button>':''}<button class="btn primary2" id="sortGo">暗転して整列する</button></div>`);$('sortGo').onclick=()=>{const key=document.querySelector('input[name=sortKey]:checked').value,dir=document.querySelector('input[name=sortDir]:checked').value;closeModal();arrange(key,dir)};if(sortUndo)$('undoSort').onclick=()=>{restoreSort();closeModal()};}
function arrange(key,dir){if(carry){say('先に持ち上げ中の作品を戻してね');return;}const ids=arts.filter(a=>a.spot).map(a=>({id:a.id,spot:a.spot}));const saved=ids.map(v=>({...v}));const ordered=ids.map(o=>getArt(o.id)).sort((a,b)=>{const av=key==='completed'?(a.completed||a.registered):a.registered,bv=key==='completed'?(b.completed||b.registered):b.registered;const c=av.localeCompare(bv);return c===0?a.id.localeCompare(b.id):(dir==='asc'?c:-c)});sortUndo=saved;const fade=$('fade');fade.classList.add('show');setTimeout(()=>{ordered.forEach((a,i)=>{a.spot=slots[i].id;});scene='gallery';pos={x:525,y:393,dir:'up',stride:0};titleBar();setTimeout(()=>{fade.classList.remove('show');say('展示品を並べ替えました');},140)},350);}
function restoreSort(){if(!sortUndo)return;sortUndo.forEach(s=>{const a=getArt(s.id);if(a)a.spot=s.spot});sortUndo=null;say('以前の展示位置に戻しました');}
function detail(id){const a=getArt(id);if(!a)return;writeModal(a.title,'EXHIBITION DETAILS',`${a.image?`<img class="photoLarge" src="${a.image}" alt="${esc(a.title)}">`:`<div class="empty">🖼️ これはサンプル展示です。写真を登録するとここに大きく表示されます。</div>`}<p><strong>${a.pieces??'不明'}ピース</strong>　完成日：${esc(displayDate(a))}</p><p class="tip">登録日：${esc(a.registered)}　${esc(a.memo||'')}</p><div class="rowbtn"><button class="btn" id="editItem">写真や内容を編集</button><button class="btn primary2" id="backList">作品一覧</button></div>`);$('editItem').onclick=()=>registerForm(a.spot,a.id);$('backList').onclick=galleryList;}
function registerForm(spot=null,editingId=null){photoDraft=null;if(!editingId&&arts.length>=50){say('この展示室の登録上限は50作品です');return;}const old=getArt(editingId),available=slots.slice(0,unlocked()).find(s=>!atSpot(s.id));const target=spot||old?.spot||available?.id||null;
 writeModal(old?'作品を編集する':'新しい作品を登録','EXHIBIT YOUR PHOTO',`<p class="tip">風景や動物など、どんな写真でもテストできます。正式なパズル写真でなくても大丈夫です。</p><label class="field">作品名<input id="artTitle" maxlength="60" placeholder="例：お気に入りの風景" value="${esc(old?.title||'')}"></label><label class="field">ピース数（任意）<input id="artPieces" type="number" inputmode="numeric" min="1" max="100000" placeholder="例：1000" value="${esc(old?.pieces??'')}"></label><label class="field">完成日<select id="dateMode"><option value="unknown" ${!old?.completed?'selected':''}>不明（登録日を並べ替えに使用）</option><option value="known" ${old?.completed?'selected':''}>分かる（日付を入力）</option></select></label><label class="field" id="dateField" ${!old?.completed?'hidden':''}>完成した日<input id="completeDate" type="date" value="${esc(old?.completed||today())}"></label><label class="field">備考<textarea id="memo" maxlength="250" placeholder="作品の思い出など">${esc(old?.memo||'')}</textarea></label><div class="field">写真（新規登録では必須）</div><div class="photoRow">${old?.image?`<img id="preview" src="${old.image}" alt="写真プレビュー">`:'<img id="preview" alt="写真プレビュー" hidden>'}<button class="btn" id="pickPhoto">写真を選ぶ</button></div><div class="validation" id="formError" role="alert"></div><div class="rowbtn"><button class="btn primary2" id="saveArt">${old?'変更を保存':'作品を登録'}</button></div>`);
 $('dateMode').onchange=()=>{$('dateField').hidden=$('dateMode').value!=='known'};
 $('pickPhoto').onclick=()=>$('photoFile').click();$('photoFile').value='';$('photoFile').onchange=async(e)=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){$('formError').textContent='画像ファイルを選んでください';return;}try{const image=await resizeImage(file);photoDraft=image;$('preview').src=image;$('preview').hidden=false;$('formError').textContent='';}catch(err){$('formError').textContent='写真を読み込めませんでした';}};
 $('saveArt').onclick=()=>{const name=$('artTitle').value.trim(),piecesText=$('artPieces').value.trim(),pieces=piecesText?Number(piecesText):null,known=$('dateMode').value==='known',date=known?$('completeDate').value:null,memo=$('memo').value.trim(),img=photoDraft||old?.image||null;if(!name){$('formError').textContent='作品名を入力してください';return;}if(piecesText&&(!Number.isSafeInteger(pieces)||pieces<=0)){$('formError').textContent='ピース数は正の整数で入力してください';return;}if(known&&!date){$('formError').textContent='完成日を入力してください';return;}if(!img&&!old){$('formError').textContent='写真を選んでください';return;}if(old){Object.assign(old,{title:name,pieces,completed:date,memo,image:img,sample:undefined});}else{const a={id:`art-${serial++}`,title:name,pieces,completed:date,registered:today(),memo,image:img,spot:null};const occupied=atSpot(target);if(target&&!occupied)a.spot=target;else{const free=slots.slice(0,Math.min(50,6*(1+Math.floor((arts.length+1)/6)))).find(s=>!atSpot(s.id));if(free)a.spot=free.id;}arts.push(a);}imageCache.clear();closeModal();titleBar();say('作品を登録しました！');};}
async function resizeImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',.85);}finally{URL.revokeObjectURL(url)}}
function bind(){const pad=document.querySelector('.gamepad');for(const event of ['contextmenu','selectstart','dragstart'])pad.addEventListener(event,e=>e.preventDefault());pad.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();clearInterval(pointerLoop);walk(b.dataset.dir);pointerLoop=setInterval(()=>walk(b.dataset.dir),110);if(b.setPointerCapture)b.setPointerCapture(e.pointerId);};for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>{clearInterval(pointerLoop);pointerLoop=null;});});window.addEventListener('blur',()=>{clearInterval(pointerLoop);pointerLoop=null;heldKeys.clear();});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(pointerLoop);pointerLoop=null;heldKeys.clear();}});window.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(d&&!(e.target instanceof HTMLInputElement)&&!(e.target instanceof HTMLTextAreaElement)){e.preventDefault();heldKeys.add(d);}if(e.key==='Escape'){if(modal)closeModal();else cancelCarry();}if(e.key==='Enter'&&!modal&&document.activeElement===document.body){e.preventDefault();act();}});window.addEventListener('keyup',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(d)heldKeys.delete(d)});let lastMove=0;setInterval(()=>{if(heldKeys.size&&performance.now()-lastMove>90){walk([...heldKeys][0]);lastMove=performance.now();}},36);$('action').onclick=act;$('carryCancel').onclick=cancelCarry;$('newArtwork').onclick=()=>registerForm();$('openGallery').onclick=galleryList;$('goEntrance').onclick=()=>sceneTo('entrance');canvas.addEventListener('click',inspectTap);}
